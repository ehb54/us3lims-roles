---
# EL10 counterpart of install-vncserver: the same per-user Xvnc sessions, vncadmin/vncctl and
# admin registration, with the TigerVNC project's EL10 RPMs and an icewm session.

- name: This role is for EL10 and later (EL8 uses install-vncserver)
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == "RedHat"
      - ansible_facts['distribution_major_version'] | int >= 10
    fail_msg: >-
      install-vncserver-el10 is for EL10+; use install-vncserver on
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_major_version'] }}
    quiet: true

- name: Directory for the TigerVNC RPMs
  ansible.builtin.file:
    path: "{{ tigervnc_el10_rpm_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Download the TigerVNC EL10 RPMs (checked by SHA-256)
  ansible.builtin.get_url:
    url: "{{ tigervnc_el10_url }}/{{ item.arch }}/{{ item.name }}-{{ tigervnc_el10_version }}-{{ tigervnc_el10_release }}.{{ item.arch }}.rpm/download"
    dest: "{{ tigervnc_el10_rpm_dir }}/{{ item.name }}-{{ tigervnc_el10_version }}-{{ tigervnc_el10_release }}.{{ item.arch }}.rpm"
    checksum: "sha256:{{ item.sha256 }}"
    timeout: "{{ tigervnc_el10_download_timeout }}"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ tigervnc_el10_rpms }}"
  loop_control:
    label: "{{ item.name }}"
  register: tigervnc_el10_download
  # retried per file: SourceForge's mirror redirects time out now and then
  until: tigervnc_el10_download is succeeded
  retries: "{{ tigervnc_el10_download_retries }}"
  delay: 10

## One transaction: tigervnc-server requires tigervnc-selinux whenever
## selinux-policy-targeted is installed. GPG checking is off for these
## local files only: EL10's rpm rejects TigerVNC's signing key (SHA-1
## self-signature); the SHA-256 checksums above stand in for it.
- name: Install TigerVNC from the downloaded RPMs, icewm and fonts
  ansible.builtin.dnf:
    name: "{{ tigervnc_el10_download.results | map(attribute='dest') | list + vnc_el10_packages }}"
    disable_gpg_check: true
    state: present

## ultrascan-tickets#1314: EL8 and EL9 have their own tigervnc-server and EL10 has none, so on the
## way to EL10 that package goes (with Leapp or before it), and RPM keeps vncserver.users, with the
## displays vncadmin gave the users, as vncserver.users.rpmsave. The RPMs above bring a new
## vncserver.users without them, and the admins count as provisioned, so nothing below adds them
## again. On an OS-upgrade converge the old assignments are put back when the new file has none.
## The users' ~/.vnc files stay usable: TigerVNC still reads ~/.vnc, and for a session this OS
## lacks (EL8's gnome) it starts the first one in /usr/share/xsessions.
- name: OS-upgrade converge, read the VNC display assignments in vncserver.users
  ansible.builtin.command: grep -E '^\s*:[0-9]+\s*=\s*\S+\s*$' /etc/tigervnc/vncserver.users
  register: vnc_os_upgrade_users_now
  changed_when: false
  failed_when: vnc_os_upgrade_users_now.rc > 1
  when: lims_os_upgrade | default(false) | bool

- name: OS-upgrade converge, read the old OS's VNC display assignments in vncserver.users.rpmsave
  ansible.builtin.command: grep -E '^\s*:[0-9]+\s*=\s*\S+\s*$' /etc/tigervnc/vncserver.users.rpmsave
  register: vnc_os_upgrade_users_old
  changed_when: false
  ## rc 1: no assignments in it; rc 2: no such file. Either way there is nothing to put back.
  failed_when: false
  when:
    - lims_os_upgrade | default(false) | bool
    - vnc_os_upgrade_users_now.stdout_lines | length == 0

- name: OS-upgrade converge, give the users back the VNC displays they had on the old OS
  ansible.builtin.lineinfile:
    path: /etc/tigervnc/vncserver.users
    line: "{{ item | trim }}"
  loop: "{{ vnc_os_upgrade_users_old.stdout_lines if (vnc_os_upgrade_users_old.rc | default(1)) == 0 else [] }}"
  when:
    - lims_os_upgrade | default(false) | bool
    - vnc_os_upgrade_users_now.stdout_lines | length == 0

- name: Add group 'vncusers'
  ansible.builtin.group:
    name: vncusers
    state: present

- name: Install vncadmin
  ansible.builtin.template:
    src: vncadmin.j2
    dest: /usr/sbin/vncadmin
    owner: root
    group: root
    mode: u=rx

- name: Install vncctl
  ansible.builtin.copy:
    src: vncctl
    dest: /usr/bin/vncctl
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx

- name: Let vncusers run vncctl through sudo
  ansible.builtin.copy:
    src: vncctl.sudoers.d
    dest: /etc/sudoers.d/vncctl
    owner: root
    group: root
    # 0440: visudo -c rejects a sudoers file with any other mode (ultrascan-tickets#1311)
    mode: u=r,g=r,o=
    validate: visudo -cf %s

- name: Directory for icewm's system configuration
  ansible.builtin.file:
    path: /etc/icewm
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: vnc_icewm_toolbar | bool

- name: Taskbar buttons for UltraScan and SOMO in icewm
  ansible.builtin.template:
    src: icewm-toolbar.j2
    dest: /etc/icewm/toolbar
    owner: root
    group: root
    mode: '0644'
  when:
    - vnc_icewm_toolbar | bool
    - qt_version is defined
    - qwt_version is defined

## Admin VNC registration: the same marker logic as install-vncserver,
## which this role replaces on EL10. config-lims-admin writes
## /etc/lims-admin-accounts-pending and sets lims_admin_fresh; the last
## role that reads "not yet provisioned" writes the provisioned marker.
## On EL10 that is this role, so a play that leaves out both VNC roles
## must write the marker itself.
- name: Check whether admin accounts have already been provisioned once
  ansible.builtin.stat:
    path: /etc/lims-admin-accounts-provisioned
  register: lims_admin_accounts_provisioned

- name: Add admin users to vnc (fresh install only -- see install-vncserver)
  ansible.builtin.command:
    cmd: /usr/sbin/vncadmin add {{ item }}
  loop: "{{ vnc_admin_users }}"
  register: lims_vnc_admin_add
  # a user registered by an earlier, partly failed run is already done
  failed_when: lims_vnc_admin_add.rc != 0 and 'is already defined' not in lims_vnc_admin_add.stderr
  changed_when: lims_vnc_admin_add.rc == 0
  ignore_errors: true
  environment:
    USER: root
  when: lims_admin_fresh | bool

- name: Record that admin accounts have now been provisioned once
  ansible.builtin.file:
    path: /etc/lims-admin-accounts-provisioned
    state: touch
    owner: root
    group: root
    mode: '0644'
  when:
    - not lims_admin_accounts_provisioned.stat.exists
    - not (lims_pre_430 | default(false) | bool and lims_admin_global_config_existed_already.stat.exists)
    - lims_vnc_admin_add is not failed

- name: Clear the pending admin provisioning marker
  ansible.builtin.file:
    path: /etc/lims-admin-accounts-pending
    state: absent
  when: lims_vnc_admin_add is not failed
