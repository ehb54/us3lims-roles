---
# https://habilis.net/cronic/
- name: Copy over cronic script
  copy:
    src: cronic
    dest: /usr/bin/cronic
    mode: '0755'
    owner: root
    group: root

# the cron module refuses cron_file: /etc/crontab, so write the lines it used to put there:
# MAILTO at the top, and each job under its "#Ansible: <name>" marker
- name: Set Cron Admin
  lineinfile:
    path: /etc/crontab
    regexp: '^MAILTO='
    line: 'MAILTO="{{ cron_admin }}"'
    insertbefore: BOF

