---
# 1009 was picked just to follow the uid on demeler3
- set_fact:
    user_home: "/home"
  when: user_home is undefined

- name: install dependencies RedHat
  dnf:
    name:
      - git
      - httpd
      - php
    update_cache: yes
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

- name: install dependencies Debian
  apt:
    name:
      - git
      - apache2
      - php
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Create group for us3
  group:
    name: us3
    state: present

- name: Create the ultrascan3 user
  user:
    name: us3
    comment: ultrascan3 system user
    group: us3
    shell: /bin/bash
    state: present

- set_fact:
    sql_branch: "{{ site_release }}"
  when: sql_branch is undefined and site_release is defined

- set_fact:
    utils_branch: "{{ site_release }}"
  when: utils_branch is undefined and site_release is defined

- name: make {{ user_home }}/us3/lims/database/sql safe
  shell:
    cmd: "git config --global --add safe.directory {{ user_home }}/us3/lims/database/sql"

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ user_home }}/us3/lims/database/sql"
    release_gate_label: "us3_sql"
    release_gate_branch: "{{ sql_branch }}"

- name: git clone us3_mysql repository
  git:
   repo: https://github.com/ehb54/us3_sql.git
   version: "{{ sql_branch }}"
   dest: "{{ user_home }}/us3/lims/database/sql"

- name: make {{ user_home }}/us3/lims/database/utils safe
  shell:
    cmd: "git config --global --add safe.directory {{ user_home }}/us3/lims/database/utils"

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ user_home }}/us3/lims/database/utils"
    release_gate_label: "us3lims_dbutils"
    release_gate_branch: "{{ utils_branch }}"

- name: git clone us3lims_dbutils repository
  git:
   repo: https://github.com/ehb54/us3lims_dbutils.git
   version: "{{ utils_branch }}"
   dest: "{{ user_home }}/us3/lims/database/utils"

- name: Change ownership of us3lims_dbutils
  ansible.builtin.file:
    path: "{{ user_home }}/us3/lims/database/utils"
    state: directory
    recurse: yes
    owner: us3
    group: us3

- set_fact:
    gridctl_branch: "{{ site_release | default(branch) }}"
  when: gridctl_branch is undefined

- name: make {{ user_home }}/us3/lims/database/utils safe
  shell:
    cmd: "git config --global --add safe.directory {{ user_home }}/us3/lims/bin"

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ user_home }}/us3/lims/bin"
    release_gate_label: "us3lims_gridctl"
    release_gate_branch: "{{ gridctl_branch }}"

- name: git clone gridctl repository to bin
  git:
   repo: https://github.com/ehb54/us3lims_gridctl.git
   version: "{{ gridctl_branch }}"
   dest: "{{ user_home }}/us3/lims/bin"

- name: Change permissions in gridctl
  file:
      path: "{{ user_home }}/us3/lims/bin"
      state: directory
      recurse: yes
  changed_when: false

## gridctl owns listen-config.php's layout; only this site's values are set here.
##
## dbutils' uslims_upgrade.php migrates a pre-4.3.0 listen-config.php to its
## own "values only, version 2" contract, and from then on refuses to touch
## the file again once it reads $listen_config_version >= 2 -- "rerun the
## script rather than editing by hand" is its own stated contract too. This
## task used to re-template the file from this role's own (pre-upgrade-
## shaped) template on every run regardless, which reverted that migration
## on its very next run: gridctl's bootstrap refuses to start against a
## pre-upgrade file (round-13, us3lims-roles#24), stranding every job on the
## host until an operator reran the upgrade by hand. Originally gated on
## $listen_config_version's presence, since that only exists in the v2
## contract -- the same signal uslims_upgrade.php itself already checks for.
##
## Round 15, us3lims-roles#24 blocking: that marker-based gate has the exact
## same class of bug config-lims-lims's global_config.php copy task had.
## $listen_config_version is 4.3.0-era and does not exist in a 4.2.0-pinned
## site's own gridctl checkout's template at all -- so on a host pinned to
## an older release (gridctl_branch tracking a pre-4.3.0 site_release),
## this grep never matches, and this task re-templated the file from that
## older template on EVERY run, not just the first. The older template has
## no $host_name placeholder either, so the regex_replace below for that
## key silently matched nothing each time, losing it from the file (a
## GMP e-signature mail's From: header then has no host name) -- and every
## other run changed five more files besides, none of them the one-time
## convergence us3lims-roles#24 is supposed to be. Gated on the file's own
## pre-existence instead, the same fix as global_config.php's: a run on a
## host that already has a listen-config.php, 4.2.0 or 4.3.0 shaped,
## upgraded or not, changes nothing here -- exactly the "a run on a 4.2.0
## host changes nothing" requirement, with no dependency on which release's
## template happens to define which variables.
- name: Check whether listen-config.php exists yet (fresh install vs. an existing host, any release)
  ansible.builtin.stat:
    path: "{{ user_home }}/us3/lims/bin/listen-config.php"
  register: listen_config_existed_already

- name: Read the deployed gridctl listen-config template
  ansible.builtin.slurp:
    src: "{{ user_home }}/us3/lims/bin/listen-config.php.template"
  register: listen_config_template
  when: not listen_config_existed_already.stat.exists

- name: Write listen-config.php with this site's values (first install only -- see the check above)
  ansible.builtin.copy:
    content: |-
      {%- set ns = namespace(text=listen_config_template.content | b64decode) -%}
      {%- for key, value in listen_config_values.items() -%}
      {%- set ns.text = ns.text | regex_replace('(?m)^[$]' ~ key ~ '[ ]*=[^;]*;', '$' ~ key ~ ' = ' ~ php_quote ~ (value | replace(php_quote, php_escaped_quote)) ~ php_quote ~ ';') -%}
      {%- endfor -%}
      {{ ns.text | regex_replace('(?m)^date_default_timezone_set[(][^)]*[)]', 'date_default_timezone_set( ' ~ php_quote ~ time_zone ~ php_quote ~ ' )') }}
    dest: "{{ user_home }}/us3/lims/bin/listen-config.php"
    owner: us3
    group: us3
    mode: '0644'
    validate: '/usr/bin/php -l %s'
  vars:
    php_quote: "'"
    php_escaped_quote: "\\'"
    listen_config_values:
      submit_dir: "{{ submit_dir }}"
      servhost: "{{ hostname }}"
      host_name: "{{ hostname }}"
      class_dir: "{{ class_dir_p }}"
      org_name: "{{ org_name }}"
      org_domain: "{{ org_domain }}"
      admin_email: "{{ gridctl_admin_email }}"
  when: not listen_config_existed_already.stat.exists
  notify: restart us3-listen


- name: Set us3 ownership of us3/lims/bin
  command:
    chdir: "{{ user_home }}/us3/lims/bin"
    cmd: chown -R us3:us3 .

- name: Create us3/etc
  file:
    path: "{{ user_home }}/us3/lims/etc"
    state: directory
    owner: us3
    group: us3

- name: Run LIMS related tasks
  import_tasks: lims-tasks.yml
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''
