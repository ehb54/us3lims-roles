---
# lims-tasks.yml : additional tasks when usiab/lims is being created.
#                  this provides allows role reuse when creating the aucsol site

- name: create instances folder
  file:
    path: '{{ user_home }}/us3/lims/database/instances'
    state: directory
    owner: us3
    group: "{{ www_user }}"

- name: Make sure work folder exists
  file:
    path: '{{ user_home }}/us3/lims/work'
    state: directory
    owner: us3
    group: "{{ www_user }}"

- name: Make sure scripts folder exists
  file:
    path: '{{ user_home }}/us3/lims/scripts'
    state: directory
    owner: us3
    group: us3

- name: Copy over make-uma-uiab script
  copy:
    src: 'make-uma-uiab'
    dest: '{{ user_home }}/us3/lims/scripts/make-uma-uiab'
    owner: us3
    group: us3
    mode: 0755

## An operator's cluster_config.php is where cluster/pool entries actually
## live once a site is running -- copying the template over it on every
## run, with no existence check at all, reverted every edit on the very
## next ansible run.
- name: Check whether cluster_config.php already exists
  ansible.builtin.stat:
    path: '{{ user_home }}/us3/lims/bin/cluster_config.php'
  register: cluster_config_exists

- name: copy cluster_config.php.template to cluster_config.php (first install only -- see the check above)
  ansible.builtin.copy:
   remote_src: yes
   src: '{{ user_home }}/us3/lims/bin/cluster_config.php.template'
   dest: '{{ user_home }}/us3/lims/bin/cluster_config.php'
   owner: us3
   group: us3
   mode: 0644
  when: not cluster_config_exists.stat.exists

- name: Change permissions in gridctl
  file:
      path: '{{ user_home }}/us3/lims/bin'
      state: directory
      recurse: yes
  changed_when: false

- name: Set us3 ownership of us3/lims/bin
  command:
    chdir: "{{ user_home }}/us3/lims/bin"
    cmd: chown -R us3:us3 .

- name: Set us3 ownership of us3/lims/database/sql
  command:
    chdir: "{{ user_home }}/us3/lims/database/sql"
    cmd: chown -R us3:us3 .

- name: check if us3-pipe exists
  stat:
    path: "{{ user_home }}/us3/lims/etc/us3-pipe"
  register: us3pipe

- name: Create us3-pipe
  shell:
    cmd: mkfifo {{ user_home }}/us3/lims/etc/us3-pipe
  become_user: us3
  become: yes
  when: us3pipe.stat.exists == false

## Cron entries and the us3-listen service itself are started by the
## start-lims-services role instead, much later in the play -- starting them here, before config-lims-
## lims and install-demo-dbinst run uslims_upgrade.php, left the host not
## idle by the time either of those checked, so the upgrade always refused.
## See UPGRADE-AND-INSTALL-MODEL.md.


