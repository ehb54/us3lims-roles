---
# defaults file for build-us-mpi

us3_path: "{{ user_home }}/us3"
us3_nodb_path: "{{ us3_path }}/us3-nodb"
us3_cluster_path: "{{ us3_path }}/cluster"
gcc_path: "{{ '/opt/rh/gcc-toolset-9/root/bin' if ansible_facts['os_family'] == 'RedHat' else '/usr/bin' }}"
mpi_test_path: "{{ us3_path }}/tests"

# git url ultrascan3 is cloned from, override with -e "us3_repo=..." to build us3_branch from a fork
us3_repo: "https://github.com/ehb54/ultrascan3.git"
