---
- name: install php related dependencies
  dnf:
      enablerepo: "{{ powertools }}"
      name: "{{ packages }}"
      update_cache: yes

- name: Check if magik already exists
  stat:
        path: /usr/lib64/php/modules/imagick.so
  register: imagick_module

- name: Install magik
  shell: echo '' | /usr/bin/pecl install imagick
  when: imagick_module.stat.exists == false

- name: Configure php.ini
  copy:
        src: php.ini
        dest: /etc/php.ini
        backup: yes
  notify: restart php-fpm


- name: Configure php-fpm.conf
  copy:
        src: php-fpm.conf
        dest: /etc/php-fpm.conf
        backup: yes
  notify: restart php-fpm

- name: Configure www.conf
  copy:
        src: www.conf
        dest: /etc/php-fpm.d/www.conf
        backup: yes
  notify: restart php-fpm

## www.conf's pool runs as user=us3, group=apache, but the log directory and
## its pre-existing log files (created root:root by the php-fpm package) are
## not writable by either -- the pool's own php_admin_value[error_log] and
## slowlog then fail to open silently, and nothing from that pool's PHP
## errors or slow-request log ever reaches disk.
- name: Ensure the php-fpm log directory is writable by the pool
  ansible.builtin.file:
    path: /var/log/php-fpm
    state: directory
    owner: root
    group: apache
    mode: '0775'

- name: Ensure the pool's own error and slow logs are writable by the pool
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: us3
    group: apache
    mode: '0664'
    access_time: preserve
    modification_time: preserve
  loop:
    - /var/log/php-fpm/www-error.log
    - /var/log/php-fpm/www-slow.log
