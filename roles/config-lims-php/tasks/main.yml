---
- name: install php related dependencies
  dnf:
      enablerepo: "{{ powertools }}"
      name: "{{ packages }}"
      update_cache: yes

# an imagick.so built for another php version exists but does not load
- name: Check if magik loads
  command: >-
    php -n -d extension=imagick.so -r "exit(extension_loaded('imagick') ? 0 : 1);"
  register: imagick_module
  changed_when: false
  failed_when: false

# umask 022 so a host running Ansible with umask 0027 leaves imagick.so readable to php-fpm
- name: Install magik
  shell: umask 022 && echo '' | /usr/bin/pecl install -f imagick-{{ lims_php_imagick_version }}
  when: imagick_module.rc != 0

- name: Configure php.ini
  copy:
        src: php.ini
        dest: /etc/php.ini
        backup: yes
  notify: restart php-fpm


- name: Configure php-fpm.conf
  copy:
        src: php-fpm.conf
        dest: /etc/php-fpm.conf
        backup: yes
  notify: restart php-fpm

- name: Configure www.conf
  copy:
        src: www.conf
        dest: /etc/php-fpm.d/www.conf
        backup: yes
  notify: restart php-fpm
