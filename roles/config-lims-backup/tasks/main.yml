---
# tasks file for config-lims-backup
- set_fact:
    user_home: "/home"
  when: user_home is undefined

- name: Check if db_config setup
  stat: 
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
  register: db_config_details
  failed_when: not db_config_details.stat.exists

# needed for backup to run
- name: Check if {{ user_home }}/us3/lims/bin/listen-config.php exists
  stat: 
    path: "{{ user_home }}/us3/lims/bin/listen-config.php"
  register: listen_config_details
  failed_when: not listen_config_details.stat.exists

- name: make directory /srv/data directories if non existant
  file:
    path: "{{ item }}"
    state: directory
    mode: 0755
    group: usadmin
    owner: usadmin
  loop:
    - /srv/data
    - /srv/data/sqldumps
    - /srv/data/log

# one line per lineinfile: it compares file lines one at a time, so a two-line "line:"
# never matched and was appended again on every run
- name: install daily backup marker in /etc/crontab
  ansible.builtin.lineinfile:
    path: /etc/crontab
    line: "# Ansible: daily backup"

- name: install in cronic
  ansible.builtin.lineinfile:
    path: /etc/crontab
    regexp: '/uslims_daily_backup\.php$'
    line: "10 0 * * * root /usr/bin/cronic php {{ user_home }}/us3/lims/database/utils/uslims_daily_backup.php"
    insertafter: '^# Ansible: daily backup$'
