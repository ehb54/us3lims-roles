---
# tasks file for restart-php-fpm
#
# A finished host is only started here, so a re-run does not bounce live
# PHP-FPM requests or GMP e-signature sessions; config-lims-php and
# config-lims-apache restart them through their handlers when a file changes.
# While a fresh install is unfinished, a failed run may have lost those
# handlers, so both are restarted.

- name: ensure php-fpm is running and enabled
  service:
       name: php-fpm
       enabled: yes
       state: "{{ 'restarted' if lims_fresh_install_pending.stat.exists | default(false) else 'started' }}"

- name: ensure httpd is running and enabled
  service:
       name: httpd
       enabled: yes
       state: "{{ 'restarted' if lims_fresh_install_pending.stat.exists | default(false) else 'started' }}"
