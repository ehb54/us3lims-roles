---
# tasks file for renice-mariadb

- name: copy nice.conf to /etc/systemd/system/mariadb.service.d
  ansible.builtin.copy:
    src: nice.conf
    dest: /etc/systemd/system/mariadb.service.d/nice.conf
    owner: root
    group: root
    mode: '0644'
  register: mariadb_nice_conf

# only when nice.conf changed: a restart drops every in-flight database connection
- name: reload systemd daemon
  systemd:
       daemon_reload: yes
  when: mariadb_nice_conf is changed

- name: restart MariaDB
  service:
       name: mariadb
       enabled: yes
       state: restarted
  when: mariadb_nice_conf is changed
