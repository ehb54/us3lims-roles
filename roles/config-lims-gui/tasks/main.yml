---
# tasks file for config-lims-gui

# The GNOME favorites below go into /etc/dconf/db/local.d, which only a desktop install brings
# (dconf). A host installed without one (the installer's "Server" environment) gets Workstation
# here, as hand-built hosts did with dnf -y groupinstall workstation; a host that already has
# GNOME (Workstation or Server with GUI) is left alone. EL10 too: its VNC desktop is icewm
# (install-vncserver-el10), so GNOME there is for the console. -y: Ansible gives dnf no
# terminal, so without it dnf stops at its prompt (ultrascan-tickets#1311).
- name: Check whether GNOME is installed
  command: rpm -q gnome-shell
  register: lims_gui_gnome
  changed_when: false
  failed_when: false
  check_mode: false

- name: groupinstall workstation
  command: dnf -y groupinstall workstation
  when: >-
    install_workstation | default(false) | bool
    or (lims_gui_gnome.rc != 0
        and not install_server_with_gui | default(false) | bool)

- name: groupinstall Server with GUI
  command: dnf -y groupinstall "Server with GUI"
  when: install_server_with_gui|default(false)

- name: install xorg-x11-apps
  dnf:
    enablerepo: "{{ powertools }}"
    name:
      - xorg-x11-apps
    state: present
  # EL10 has no X.Org server and no xorg-x11-apps (Wayland/Xwayland only)
  when: ansible_facts['distribution_major_version'] | int < 10

- import_tasks: desktops.yml

- name: setup gnome default favorites for non-commercial
  copy:
    src: 00-favorite-apps
    dest: /etc/dconf/db/local.d/00-favorite-apps
    mode: u=rwx,g=rx,o=rx
    owner: root
    group: root
  when: not install_commercial|default(false)

- name: setup gnome default favorites for commercial
  copy:
    src: 00-favorite-apps-commercial
    dest: /etc/dconf/db/local.d/00-favorite-apps
    mode: u=rwx,g=rx,o=rx
    owner: root
    group: root
  when: install_commercial|default(false)

- name: install evolution mail client
  dnf:
      name: evolution
      state: present
      update_cache: yes

- name: update dconf database
  command: dconf update
  