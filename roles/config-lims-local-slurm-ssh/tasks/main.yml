---
- name: Configure passwordless SSH from us3 to the local Slurm node
  block:
    - name: Ensure the us3 SSH directory exists
      ansible.builtin.file:
        path: "{{ local_slurm_user_home }}/.ssh"
        state: directory
        owner: "{{ local_slurm_user }}"
        group: "{{ local_slurm_user }}"
        mode: '0700'

    - name: Create a persistent key for local cluster commands
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -q
          - -t
          - ed25519
          - -N
          - ''
          - -f
          - "{{ local_slurm_user_home }}/.ssh/id_ed25519"
        creates: "{{ local_slurm_user_home }}/.ssh/id_ed25519"
      become_user: "{{ local_slurm_user }}"

    - name: Read the local cluster client key
      ansible.builtin.slurp:
        src: "{{ local_slurm_user_home }}/.ssh/id_ed25519.pub"
      register: local_slurm_public_key

    - name: Authorize us3 for local cluster commands
      ansible.posix.authorized_key:
        user: "{{ local_slurm_user }}"
        key: "{{ local_slurm_public_key.content | b64decode }}"
        key_options: 'from="127.0.0.1,::1",no-agent-forwarding,no-port-forwarding,no-X11-forwarding,no-pty'
        state: present

    - name: Map the local cluster name to this host
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^\s*127\.0\.0\.1\s+{{ local_slurm_cluster_name | regex_escape }}$'
        line: "127.0.0.1 {{ local_slurm_cluster_name }}"
        state: present

    - name: Read the local cluster SSH host key
      ansible.builtin.command:
        argv:
          - ssh-keyscan
          - "{{ local_slurm_cluster_name }}"
      register: local_slurm_host_key
      changed_when: false

    - name: Trust the local cluster host key for us3
      become_user: "{{ local_slurm_user }}"
      ansible.builtin.known_hosts:
        name: "{{ local_slurm_cluster_name }}"
        key: "{{ item }}"
        path: "{{ local_slurm_user_home }}/.ssh/known_hosts"
        hash_host: true
      loop: "{{ local_slurm_host_key.stdout_lines }}"

    - name: Set local known_hosts permissions
      ansible.builtin.file:
        path: "{{ local_slurm_user_home }}/.ssh/known_hosts"
        owner: "{{ local_slurm_user }}"
        group: "{{ local_slurm_user }}"
        mode: '0600'

    - name: Verify us3 can reach the local Slurm node
      become_user: "{{ local_slurm_user }}"
      ansible.builtin.command:
        argv:
          - ssh
          - -o
          - BatchMode=yes
          - "{{ local_slurm_cluster_name }}"
          - /bin/true
      changed_when: false
