---
# tasks file for install-demo-dbinst

- set_fact:
    user_home: "/home"
  when: user_home is undefined

- name: copy over demo data to ~us3/lims/database/utils/dbmigrate
  ansible.builtin.copy:
    src: export-full-uslims.aucsolutions.com.tar
    dest: "{{ user_home }}/us3/lims/database/utils/dbmigrate/export-full-uslims.aucsolutions.com.tar"
    owner: us3
    group: us3
    mode: '0644'

- name: create my.cnf in ~us3/lims/database/utils
  template:
    src: my.cnf.j2
    dest: "{{ user_home }}/us3/lims/database/utils/my.cnf"
    owner: us3
    group: us3
    mode: '0600'
    
- name: create my.cnf in ~us3/lims/database/utils/dbmigrate
  template:
    src: my.cnf.j2
    dest: "{{ user_home }}/us3/lims/database/utils/dbmigrate/my.cnf"
    owner: us3
    group: us3
    mode: '0600'

- name: copy ~us3/lims/database/utils/db_config.php.template to db_config.php
  ansible.builtin.copy:
    src: "{{ user_home }}/us3/lims/database/utils/db_config.php.template"
    dest: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    remote_src: yes
    owner: us3
    group: us3
    mode: '0600'
  
- name: replace SET_HOSTNAME ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET_HOSTNAME"
    replace: "{{ hostname }}"

- name: replace SET_HOST ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET_HOST"
    replace: "localhost"

- name: replace SET_USER ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET_USER"
    replace: "root"

- name: replace SET_PASSWORD ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET_PASSWORD"
    replace: "{{ root_db_pass }}"

- name: replace SET_EMAIL ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET_EMAIL"
    replace: "{{ admin_email }}"

- name: replace SET-{{ item }} in ~us3/lims/database/utils/db_config.php
  ansible.builtin.replace:
    path: "{{ user_home }}/us3/lims/database/utils/db_config.php"
    regexp: "SET-{{ item }}"
    replace: "{{ lookup('vars', '{{ item }}' ) }}"
  loop: >-
    {{ ['us3_branch', 'sql_branch', 'dbinst_branch', 'gridctl_branch', 'common_branch',
        'newinst_branch', 'webinfo_branch', 'utils_branch']
       + (['airavata_branch'] if lims_pre_430 | default(false) | bool else []) }}

- name: import data in case of failure notice
  ansible.builtin.debug:
    msg: |
         If the next step fails, it is possible the database structure changed or the uslims3_Demo db already exists
         For the former case, a new demo dataset should be created with a compatible db field structure
           alternatively, one could set the branches in the playbook to an earlier (compabitle) release
           and rerun the playbook and subqeuently upgrade using the full upgrade strategy
         The log file for this command is on the host server in ~us3/lims/database/utils/lastmigrate.log
         If you need to rerun this role, you will need to clean out the old database on the host
         This can be achieved by manually running the following commands on the host:
           rm -fr /srv/www/htdocs/uslims3/uslims3_Demo
           rm -fr ~us3/lims/database/utils/dbmigrate/import*
         and under the mysql shell on the host:
           drop database uslims3_Demo;
           delete from newus3.metadata where dbname='uslims3_Demo';

- name: import data
  ansible.builtin.shell:
    chdir: "{{ user_home }}/us3/lims/database/utils/dbmigrate"
    cmd: "yes | php -d mysqli.allow_local_infile=On stage3_import_databases.php uslims.aucsolutions.com {{ hostname }} {{ ipaddr_ext }} > lastmigrate.log 2>&1"
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

- name: update passwords
  ansible.builtin.shell:
    chdir: "{{ user_home }}/us3/lims/database/utils"
    cmd: "php uslims_people.php --update --db uslims3_Demo"
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

- name: run ~us3/lims/bin/set_cluster_authorizations.php uslims3_Demo updatepeople
  ansible.builtin.shell:
    chdir: "{{ user_home }}/us3/lims/bin"
    cmd: "php set_cluster_authorizations.php uslims3_Demo updatepeople"
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

## The imported dump's people_audit rows predate the UTC migration, and
## nothing records a per-instance UTC boundary for uslims3_Demo on its
## own: this role's import goes straight through stage3_import_databases.php,
## never through uslims_upgrade.php step 0 where that boundary is normally
## recorded for every discovered instance. Without one,
## migrate_people_audit_utc.php's own --apply refuses outright ("no UTC
## boundary is recorded for this instance") rather than guess whether every
## row needs converting -- running the full upgrade here, the same remedy
## its own refusal message names, is what lets it record one and then
## migrate through step 9, exactly as it would for any other instance on
## this host.
## Same as config-lims-lims's
## own call to this script: checked for existence first, so a host
## pinned to a pre-4.3.0 utils_branch for compatibility testing skips this
## with a clear note instead of failing the play on "Could not open input
## file". See UPGRADE-AND-INSTALL-MODEL.md.
- name: Check whether uslims_upgrade.php exists (an older dbutils checkout, e.g. a 4.2.0-pinned host, may not have it)
  ansible.builtin.stat:
    path: "{{ user_home }}/us3/lims/database/utils/uslims_upgrade.php"
  register: demo_uslims_upgrade_script
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

## config-lims-lims starts us3-listen again after its own call and restores the crontab, so this
## call idles the host again. The crontab is snapshotted and restored whole, not by pattern: see
## config-lims-lims's task.
- name: Idle the host for this call to uslims_upgrade.php
  ansible.builtin.include_role:
    name: start-lims-services
    tasks_from: idle.yml
  when: (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and demo_uslims_upgrade_script.stat.exists

- name: Snapshot /etc/crontab before idling it for this call to uslims_upgrade.php
  ansible.builtin.copy:
    src: /etc/crontab
    dest: /etc/crontab.pre-upgrade-idle-demo
    remote_src: yes
    mode: preserve
  when: (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and demo_uslims_upgrade_script.stat.exists

- name: Comment out any active LIMS cron entry in /etc/crontab before this call (restored verbatim in 'always', regardless of outcome)
  ansible.builtin.replace:
    path: /etc/crontab
    regexp: '^(?!\s*#)(.*\b(?:gridctl(?:_pro|_dev)?\.php|cluster_status\.php|update_notice\.php|listen\.php|jobmonitor\.php|uslims_daily_backup\.php|uslims_daily_rsync\.php|save-jobstats\.sh)\b.*)$'
    replace: '#\1'
  when: (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and demo_uslims_upgrade_script.stat.exists

- block:
    - name: Run uslims_upgrade.php so uslims3_Demo gets a UTC boundary and its people_audit migration
      ansible.builtin.command:
        chdir: "{{ user_home }}/us3/lims/database/utils"
        cmd: "php uslims_upgrade.php --apply --yes --www {{ www_base }}"
      register: demo_uslims_upgrade_result
      changed_when: demo_uslims_upgrade_result.rc == 0 and 'Nothing to change' not in demo_uslims_upgrade_result.stdout
      ## error_exit() (utility.php) writes "the host is not idle" to the
      ## real PHP STDERR stream, not stdout -- checked against .stdout,
      ## this phrase is never found there, so the tolerance below never
      ## actually fired; every "not idle" refusal hard-failed the play.
      failed_when: demo_uslims_upgrade_result.rc != 0 and 'the host is not idle' not in demo_uslims_upgrade_result.stderr
      when: not lims_host_busy | default(false) | bool

    - name: Note that uslims_upgrade.php refused because the host is genuinely busy (outside this play's control)
      ansible.builtin.debug:
        msg: "uslims_upgrade.php found the host still not idle; something outside this play is using it -- rerun once it is clear."
      when: not lims_host_busy | default(false) | bool and demo_uslims_upgrade_result.rc != 0 and 'the host is not idle' in demo_uslims_upgrade_result.stderr
  always:
    - name: Start us3-listen again if the idle step stopped it
      ansible.builtin.include_role:
        name: start-lims-services
        tasks_from: resume.yml

    - name: Restore /etc/crontab exactly as it was before idling it for this call
      ansible.builtin.copy:
        src: /etc/crontab.pre-upgrade-idle-demo
        dest: /etc/crontab
        remote_src: yes
        mode: preserve

    - name: Remove the crontab snapshot
      ansible.builtin.file:
        path: /etc/crontab.pre-upgrade-idle-demo
        state: absent
  when: (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and demo_uslims_upgrade_script.stat.exists

- name: Note that uslims_upgrade.php was skipped (dbutils checkout predates it)
  ansible.builtin.debug:
    msg: "{{ user_home }}/us3/lims/database/utils has no uslims_upgrade.php -- skipping uslims3_Demo's UTC boundary/migration step; pin utils_branch/site_release to 4.3.0 or newer to run it."
  when: (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and not demo_uslims_upgrade_script.stat.exists


