---
## With skip-name-resolve (config-lims-database sets it) MariaDB never matches an account whose
## host is a name, such as the server's own host name: nobody can log in through it. 10.3 still
## accepts a GRANT to one with a warning; 10.11 refuses it once the server has restarted
## (ERROR 1133), and on both SHOW GRANTS for it fails, which stops mysql_user and an export of
## the grants. Earlier versions of config-lims-database made new_us3user, us3php, gfac and
## us3_notice at the server's name. This drops such accounts (ultrascan-tickets#1290).

- name: Use the dbutils defaults file for root's credentials
  when: mariadb_hostname_login_password is not defined
  block:
    - name: Check for {{ mariadb_hostname_my_cnf }}
      ansible.builtin.stat:
        path: "{{ mariadb_hostname_my_cnf }}"
      register: mariadb_hostname_my_cnf_stat

    - name: Require {{ mariadb_hostname_my_cnf }}
      ansible.builtin.assert:
        that: mariadb_hostname_my_cnf_stat.stat.exists
        fail_msg: >-
          {{ mariadb_hostname_my_cnf }} is missing: it holds root's database credentials on LIMS hosts.
          Set mariadb_hostname_my_cnf to another defaults file with root's [client] password.
        quiet: true

## The mysql modules need PyMySQL in the python that runs them (see secure-mariadb-root).
- name: Find a python that has PyMySQL
  ansible.builtin.command:
    argv: ["{{ item }}", -c, "import pymysql"]
  loop: >-
    {{ (([ansible_python_interpreter] if ansible_python_interpreter is defined
           and not ansible_python_interpreter.startswith('auto') else [])
        + ([ansible_facts.discovered_interpreter_python] if ansible_facts.discovered_interpreter_python is defined else [])
        + mariadb_hostname_python_candidates) | unique }}
  register: mariadb_hostname_python_probe
  check_mode: false
  changed_when: false
  failed_when: false

- name: Use the first python that has PyMySQL
  ansible.builtin.set_fact:
    mariadb_hostname_python: >-
      {{ (mariadb_hostname_python_probe.results | selectattr('rc', 'equalto', 0)
          | map(attribute='item') | list + [''])[0] }}

- name: Require a python with PyMySQL
  ansible.builtin.assert:
    that: mariadb_hostname_python | length > 0
    fail_msg: >-
      No python on this host can import pymysql (tried
      {{ mariadb_hostname_python_probe.results | map(attribute='item') | join(', ') }}).
      Install python3-PyMySQL for one of them.
    quiet: true

- name: Read skip_name_resolve and the accounts
  vars:
    ansible_python_interpreter: "{{ mariadb_hostname_python }}"
  community.mysql.mysql_query:
    login_unix_socket: "{{ mariadb_hostname_socket }}"
    login_user: root
    login_password: "{{ mariadb_hostname_login_password | default(omit) }}"
    config_file: "{{ omit if mariadb_hostname_login_password is defined else mariadb_hostname_my_cnf }}"
    ## aliased: 10.3 names the result columns as the query spells them, 10.4+ (mysql.user is a
    ## view) as the view does
    query:
      - SELECT @@skip_name_resolve AS skip_name_resolve
      - SELECT User AS user, Host AS host FROM mysql.user ORDER BY host, user
  register: mariadb_hostname_read
  check_mode: false
  changed_when: false

## A host is a name unless it is localhost, empty, an IP address, or a pattern (%, _, /, or an
## IPv6 ':'): the server's own test for "needs a name lookup".
- name: Pick out the accounts at a host name
  ansible.builtin.set_fact:
    mariadb_hostname_skip: "{{ mariadb_hostname_read.query_result[0][0].skip_name_resolve | int == 1 }}"
    mariadb_hostname_named: >-
      {{ mariadb_hostname_read.query_result[1]
         | rejectattr('host', 'match', '(?i)^localhost$')
         | rejectattr('host', 'search', '[:%_/]')
         | rejectattr('host', 'match', '^[0-9.]*$')
         | list }}

## The server refuses SHOW GRANTS for an account it ignores (1141); it answers for one it matches.
- name: Ask the server for each one's grants
  vars:
    ansible_python_interpreter: "{{ mariadb_hostname_python }}"
  community.mysql.mysql_query:
    login_unix_socket: "{{ mariadb_hostname_socket }}"
    login_user: root
    login_password: "{{ mariadb_hostname_login_password | default(omit) }}"
    config_file: "{{ omit if mariadb_hostname_login_password is defined else mariadb_hostname_my_cnf }}"
    query: SHOW GRANTS FOR %s@%s
    positional_args:
      - "{{ item.user }}"
      - "{{ item.host }}"
  loop: "{{ mariadb_hostname_named }}"
  loop_control:
    label: "{{ item.user }}@{{ item.host }}"
  register: mariadb_hostname_grants
  check_mode: false
  changed_when: false
  failed_when: false

- name: Sort them
  ansible.builtin.set_fact:
    mariadb_hostname_ignored: >-
      {{ mariadb_hostname_grants.results | rejectattr('query_result', 'defined')
         | map(attribute='item') | list }}
    mariadb_hostname_matched: >-
      {{ mariadb_hostname_grants.results | selectattr('query_result', 'defined')
         | map(attribute='item') | list }}

- name: Name them
  ansible.builtin.set_fact:
    mariadb_hostname_ignored_names: >-
      {{ mariadb_hostname_ignored | map(attribute='user')
         | zip(mariadb_hostname_ignored | map(attribute='host')) | map('join', '@') | list }}

- name: Report skip_name_resolve
  ansible.builtin.debug:
    msg: >-
      skip_name_resolve is {{ 'ON' if mariadb_hostname_skip | bool else 'OFF: accounts at host names can match logins here, so nothing is dropped' }}

- name: Report the accounts at host names
  ansible.builtin.debug:
    msg: >-
      {{ item.item.user }}@{{ item.item.host }}:
      {{ ('ignored by the server ' ~ (item.msg | default('') | regex_replace('^.*: \(', '(')))
         if item.query_result is not defined else 'matched by the server (it has grants)' }}
  loop: "{{ mariadb_hostname_grants.results }}"
  loop_control:
    label: "{{ item.item.user }}@{{ item.item.host }}"

- name: Report what apply drops
  ansible.builtin.debug:
    msg: >-
      {{ ('apply drops: ' ~ (mariadb_hostname_ignored_names | join(', ')))
         if mariadb_hostname_skip | bool and mariadb_hostname_ignored else 'nothing to drop' }}

- name: Drop the accounts the server ignores, and check
  when: mariadb_hostname_mode == 'apply' and mariadb_hostname_skip | bool and mariadb_hostname_ignored | length > 0
  block:
    - name: Drop the accounts at host names that the server ignores
      vars:
        ansible_python_interpreter: "{{ mariadb_hostname_python }}"
      community.mysql.mysql_user:
        name: "{{ item.user }}"
        host: "{{ item.host }}"
        state: absent
        login_unix_socket: "{{ mariadb_hostname_socket }}"
        login_user: root
        login_password: "{{ mariadb_hostname_login_password | default(omit) }}"
        config_file: "{{ omit if mariadb_hostname_login_password is defined else mariadb_hostname_my_cnf }}"
      loop: "{{ mariadb_hostname_ignored }}"
      loop_control:
        label: "{{ item.user }}@{{ item.host }}"

    # --check drops nothing, so there is nothing to verify
    - name: Check that none of them is left
      when: not ansible_check_mode
      vars:
        ansible_python_interpreter: "{{ mariadb_hostname_python }}"
      community.mysql.mysql_query:
        login_unix_socket: "{{ mariadb_hostname_socket }}"
        login_user: root
        login_password: "{{ mariadb_hostname_login_password | default(omit) }}"
        config_file: "{{ omit if mariadb_hostname_login_password is defined else mariadb_hostname_my_cnf }}"
        query: SELECT COUNT(*) AS n FROM mysql.user WHERE CONCAT(User, '@', Host) IN ({{ (['%s'] * (mariadb_hostname_ignored | length)) | join(', ') }})
        positional_args: "{{ mariadb_hostname_ignored_names }}"
      register: mariadb_hostname_after
      changed_when: false
      failed_when: mariadb_hostname_after.query_result[0][0].n | int != 0
