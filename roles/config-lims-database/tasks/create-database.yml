---
- set_fact:
    user_home: "/home"
  when: user_home is undefined

- name: Create newus3 database
  mysql_db:
        name: "{{ us3_db_name }}"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"

## account_enabled is newer than this role's own people_create.sql used to
## be: an existing host provisioned before this column existed never gets
## people_create.sql re-run (first_install is false for it, and that is
## correct -- re-running it would be the DROP TABLE this role's own
## comment above warns about), so nothing else ever adds the column there.
## Without it, checkuser.php/activate.php's `$row["account_enabled"] != 1`
## check reads an undefined array key as not-1 and refuses every login on
## that host. ADD COLUMN IF NOT EXISTS is additive and backfills the
## DEFAULT for every existing row (verified against a real MariaDB
## 10.3.39 instance) -- it is safe to run on every single pass, first
## install included, once people_create.sql has already created the table
## with the column itself.
- name: Ensure newus3.people has the account_enabled column (hosts that predate it)
  ansible.builtin.command:
    cmd: >-
      mysql -u root -p'{{ root_db_pass }}' -e
      "ALTER TABLE {{ us3_db_name }}.people ADD COLUMN IF NOT EXISTS account_enabled TINYINT(1) UNSIGNED NOT NULL DEFAULT 1"
  changed_when: false
  when: not first_install and not lims_pre_430 | default(false) | bool

- name: Create global database
  mysql_db:
        name: "{{ gbl_db_name }}"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"

- name: Create us3 database
  mysql_db:
        name: "us3"
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"

- name: Create us3_notice database
  mysql_db:
        name: us3_notice
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"

# AUCSOL database... tables created by import from sqldump
- name: Create US_References database
  mysql_db:
        name: US_References
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  when: NO_LIMS is defined and NO_LIMS == true

# AUCSOL database... tables created by import from sqldump
- name: Create us3_register database
  mysql_db:
        name: us3_register
        state: present
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  when: NO_LIMS is defined and NO_LIMS == true

#start table creation process

# us3_notice
- name: copy over us3_notice table file
  copy:
        src: us3_notice.sql
        dest: /tmp
  when: first_install

- name: Inject tables for us3_notice
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: us3_notice
        state: import
        login_host: localhost
        target: /tmp/us3_notice.sql
  when: first_install

# newus3user
- name: Copy over the metadata_create file
  copy:
        src: metadata_create.sql
        dest: /tmp
  when: first_install

- name: Inject metadata file for newus3
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: newus3
        state: import
        login_host: localhost
        target: /tmp/metadata_create.sql
  when: first_install

- name: Copy over the people_create tables for newus3
  copy:
        src: people_create.sql
        dest: /tmp
  when: first_install

- name: Inject the people_create file into newus3
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: newus3
        state: import
        target: /tmp/people_create.sql
  when: first_install

# gfac
- name: Copy over the gfac file
  copy:
        src: gfac-db.sql
        dest: /tmp
  when: first_install

- name: Inject gfac-db file into gfac
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: gfac
        state: import
        target: /tmp/gfac-db.sql
  when: first_install

  # insert default admins for newus3_db
- name: Create a temp people sql file for dumping admins to newus3 database
  template:
          src: new_people_inject.sql.j2
          dest: /tmp/new_people_inject.sql
  when: first_install

- name: Inject the temp people sql file
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: newus3
        state: import
        target: /tmp/new_people_inject.sql
  when: first_install

- name: Clean up tmp people sql file
  file :
        path: /tmp/new_people_inject.sql
        state: absent
  when: first_install

# global
- name: Copy over the global file
  copy:
        src: global-db.sql
        dest: /tmp
  when: first_install

- name: Inject global-db file into uslims3_global
  mysql_db:
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
        name: uslims3_global
        state: import
        target: /tmp/global-db.sql
  when: first_install

