---
# new_us3user privs
- name: Do new_us3user grants 
  mysql_user:
        name: '{{ us3_db_user }}'
        host: "{{ item }}"
        append_privs: yes
        priv: '*.*:USAGE/newus3.*:ALL'
        password: "{{ us3_db_pass }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  with_items:
        - "{{ server_name }}"
        - 127.0.0.1
        - localhost
        - ::1

# us3php privs
- name: Do us3php grants
  mysql_user:
        name: 'us3php'
        host: "{{ item }}"
        priv: '*.*:USAGE/newus3.*:ALL/us3.*:SELECT,INSERT,UPDATE,DELETE/gfac.*:ALL/uslims3_*.*:SELECT,INSERT,UPDATE,DELETE'
        append_privs: yes
        password: '{{ us3php_db_pass }}'
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  with_items:
        - "{{ server_name }}"
        - 127.0.0.1
        - localhost
        - ::1

# gfac privs
#
# CREATE,ALTER,INDEX on gfac.*: this is the account uslims_upgrade.php's
# step 5 and gridctl's own migrations connect to gfac as (listen-config.php's
# guser/gpasswd). Without CREATE it cannot make the gfac tables it owns
# (since 4.3.0, the dispatch tables), so a configured metascheduler pool makes
# uslims_upgrade.php --apply (run on every play) exit rc 1, and with no pool
# they are never created. ALTER/INDEX: these tables also pick up additive
# schema changes over time (an index, a column).
- name: Grant SELECT, INSERT, UPDATE, DELETE, CREATE, ALTER, INDEX to gfac user on gfac
  mysql_user:
        name: '{{ gbl_db_user }}'
        host: "{{ item }}"
        priv: "{{ gbl_db_name }}.*:SELECT,INSERT,UPDATE,DELETE{{ '' if lims_pre_430 | default(false) | bool else ',CREATE,ALTER,INDEX' }}/uslims3_*.*:SELECT,UPDATE/uslims3_*.*:INSERT"
        append_privs: yes
        password: '{{ gbl_db_pass }}'
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  with_items:
        - "{{ server_name }}"
        - 127.0.0.1
        - localhost
        - ::1

# us3_notice privs
- name: Grant SELECT on to us3_notice user on us3_notice
  mysql_user:
        name: 'us3_notice'
        host: "{{ item }}"
        priv: "us3_notice.*:SELECT"
        append_privs: yes
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_db_pass }}"
  with_items:
        - "{{ server_name }}"
        - 127.0.0.1
        - localhost
        - ::1


