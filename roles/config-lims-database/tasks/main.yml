---
- name: assert required variables are defined
  assert:
        that:
                - us3_db_pass is defined
                - gbl_db_pass is defined
                - root_db_pass is defined
                - us3php_db_pass is defined
                - admins_db_pass is defined

- name: Turn on proxychains if use_proxychains is true
  shell:
    cmd: "echo 'LD_PRELOAD=/usr/lib/libproxychains4.so' > /etc/environment"
  when: use_proxychains|default(false)
    
- name: Install mariadb & additionals
  dnf:
    enablerepo: "{{ powertools }}"
    name:
      - mariadb-server
      - mariadb
      - python3-PyMySQL
    update_cache: yes

- name: Turn off proxychains if use_proxychains is true
  shell:
    cmd: "echo '# LD_PRELOAD=/usr/lib/libproxychains4.so' > /etc/environment"
  when: use_proxychains|default(false)

- name: Create Folder for custom mariadb service file
  file:
    path: /etc/systemd/system/mariadb.service.d/
    state: directory

- name: Add custom limits systemd file for mariadb
  template:
       src: limits.conf.j2
       dest: /etc/systemd/system/mariadb.service.d/limits.conf

- name: reload daemon
  systemd:
       daemon_reload: yes

- name: Make sure path mysql ssl folder path exists
  file:
    path: /etc/my.cnf.d/ssl
    state: directory
    owner: mysql
    group: mysql

- name: Copy over mysql ssl files from ultrascan
  copy:
    src: "{{ item }}"
    dest: /etc/my.cnf.d/ssl/{{ item }}
    owner: mysql
    group: mysql
    mode: 0640
  with_items:
       - server-cert.pem
       - server-key.pem
       - ca-cert.pem
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

- name: Copy over mysql ssl files from ultrascan - new CERTS 2024
  copy:
    src: "{{ item }}-2024"
    dest: /etc/my.cnf.d/ssl/{{ item }}
    owner: mysql
    group: mysql
    mode: 0640
  with_items:
       - server-cert.pem
       - server-key.pem
       - ca-cert.pem
  when: NO_LIMS is defined and NO_LIMS == true

- name: Template /etc/my.cnf
  template:
    src: my.cnf
    dest: /etc/my.cnf
    backup: yes

- name: Gary's settings in mariadb-server.cnf, as one block
  ansible.builtin.import_tasks: mariadb-server-settings.yml

- name: start & enable MariaDB
  service:
       name: mariadb
       enabled: yes
       state: started

- name: check if root_pw_set
  shell: mysqladmin -u root status
  changed_when: false
  failed_when: false
  register: root_pwd_check

- name: Set initial MariaDB root password
  shell: /usr/bin/mysqladmin -u root password "{{ root_db_pass }}"
  when: root_pwd_check.rc == 0

# This might be better to be moved to a standalone playbook
- name: Change root database password
  mysql_user:
        name: 'root'
        host: "{{ item }}"
        append_privs: yes
        password: "{{ root_db_pass }}"
        login_unix_socket: /var/lib/mysql/mysql.sock
        login_user: root
        login_password: "{{ root_old_db_pass }}"
  with_items:
        - "{{ hostname}}"
        - 127.0.0.1
        - localhost
        - ::1
  when: root_old_db_pass is defined

- name: Remove anon user
  mysql_user:
          name: ''
          host_all: yes
          state: absent
          login_unix_socket: /var/lib/mysql/mysql.sock
          login_user: root
          login_password: "{{ root_db_pass }}"

## mysql_install_db (MariaDB 10.3) leaves root@127.0.0.1, root@::1 and root@<hostname> with no
## password; the tasks above set only root@localhost's unless root_old_db_pass is given
## (ultrascan-tickets#1294). Nothing to do on MariaDB 10.4+.
- name: Drop the root accounts that have no password
  ansible.builtin.include_role:
    name: secure-mariadb-root
  vars:
    mariadb_root_mode: apply
    mariadb_root_login_password: "{{ root_db_pass }}"

## root_pwd_check (mysqladmin -u root status, with no explicit -p) is only
## ever meant to answer "does root have no password yet", so the initial
## password-set task above can tell a genuinely fresh host apart from one
## already provisioned. It does NOT reliably answer that once a root
## ~/.my.cnf exists: mysqladmin then authenticates from the cached
## credentials and reports rc==0 regardless of whether a password is
## already set, on every single run from then on. create-database.yml's
## imports used to gate on this same rc, so a re-run against an already-
## provisioned host with a root ~/.my.cnf re-ran every DROP TABLE IF
## EXISTS ... CREATE TABLE ... import in this role, including gfac's
## and newus3's people/metadata tables, silently emptying live data.
## Whether newus3.people already exists is checked directly instead, and
## is what every import task below is actually gated on.
- name: Check whether newus3 has already been populated (first install vs. a re-run)
  ansible.builtin.shell:
    cmd: >-
      mysql -N -B -u root -p'{{ root_db_pass }}' -e
      "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='newus3' AND table_name='people'"
  register: newus3_already_populated
  changed_when: false
  failed_when: false

- name: Create databases and tables
  import_tasks: create-database.yml
  vars:
    first_install: "{{ (newus3_already_populated.stdout | default('0')) | trim == '0' }}"

- name: Create db grants
  import_tasks: create-grants.yml

## Earlier versions of create-grants.yml also made each account at the server's host name, which
## the server ignores under skip-name-resolve; MariaDB 10.11 refuses grants to such an account
## (ultrascan-tickets#1290). Nothing to do on a host this version built.
- name: Drop the accounts at host names, which the server ignores
  ansible.builtin.include_role:
    name: mariadb-hostname-accounts
  vars:
    mariadb_hostname_mode: apply
    mariadb_hostname_login_password: "{{ root_db_pass }}"
