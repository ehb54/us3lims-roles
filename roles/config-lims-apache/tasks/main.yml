- name: install apache
  dnf:
    name:
      - httpd
      - mod_ssl
    update_cache: yes

- name: Enable service httpd, and not touch the state
  service:
        name: httpd
        enabled: yes
- name: Start service httpd, if not started
  service:
        name: httpd
        state: started

- name: Ensure www path exists
  file:
        path: "{{ www_base }}"
        owner: us3
        group: "{{ www_user }}"
        state: directory

- name: Warning if certbot fails
  ansible.builtin.debug:
    msg: certbot will fail if firewall does not have ports 80,443 open
  when: self_signed == 'no'

- include_role:
         name: geerlingguy.certbot
  when: self_signed == 'no'

- name: Create ssl folder for self-signed cert
  file:
        path: "{{ ssl_self_base_path }}"
        state: directory
  when: self_signed == 'yes'

- name: generate the self-signed private key
  openssl_privatekey:
        path: "{{ ssl_self_key_path }}"
  when: self_signed == 'yes'

- name: generate the self-signed csr
  openssl_csr:
        path: "{{ ssl_self_csr_path }}"
        privatekey_path: "{{ ssl_self_key_path }}"
  when: self_signed == 'yes'

- name: Generate self signed ssl
  openssl_certificate:
        provider: selfsigned
        path: "{{ ssl_self_cert_path }}"
        privatekey_path: "{{ ssl_self_key_path }}"
        csr_path: "{{ ssl_self_csr_path }}"
  when: self_signed == 'yes'

- name: Configure base apache2 config from template
  template:
        src: httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
        backup: yes

- name: Configure virtual host for redirect
  template:
        src: http-server.conf.j2
        dest: "/etc/httpd/conf.d/http-{{ server_name }}.conf"
        backup: yes
  notify:
        - restart apache
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

- name: configure Virtual host for ssl
  template:
        src: https-server.conf.j2
        dest: "/etc/httpd/conf.d/https-{{ server_name }}.conf"
        backup: yes
  notify:
        - restart apache
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

## This task used to
## copy dbutils' RAW csp-report-only.conf straight to /etc/httpd/conf.d/
## lims-csp.conf, unscoped -- applying the policy server-wide, to every
## vhost, not just the LIMS docroot. uslims_upgrade.php's own step 7
## installs this same file correctly, wrapped in "<Directory $wwwpath>",
## but only when no policy is configured yet at all (DUMP_INCLUDES scan) --
## since this task ran first, on every single run (listen_config_is_v2.rc
## == 0 stays true forever once a host is upgraded), step 7 always found
## one already there and left it alone, so the correctly-scoped version
## never actually got installed on a roles-built host. Removed: step 7 is
## the sole, correctly-scoped installer now, same "one owner" rule as
## config-lims-mpi-runtime's global_config.php task above. See
## UPGRADE-AND-INSTALL-MODEL.md.
