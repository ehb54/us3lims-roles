- name: install apache
  dnf:
    name:
      - httpd
      - mod_ssl
    update_cache: yes

- name: Enable service httpd, and not touch the state
  service:
        name: httpd
        enabled: yes
- name: Start service httpd, if not started
  service:
        name: httpd
        state: started

- name: Ensure www path exists
  file:
        path: "{{ www_base }}"
        owner: us3
        group: "{{ www_user }}"
        state: directory

- name: Warning if certbot fails
  ansible.builtin.debug:
    msg: certbot will fail if firewall does not have ports 80,443 open
  when: self_signed == 'no'

- include_role:
         name: geerlingguy.certbot
  when: self_signed == 'no'

- name: Create ssl folder for self-signed cert
  file:
        path: "{{ ssl_self_base_path }}"
        state: directory
  when: self_signed == 'yes'

- name: generate the self-signed private key
  openssl_privatekey:
        path: "{{ ssl_self_key_path }}"
  when: self_signed == 'yes'

- name: generate the self-signed csr
  openssl_csr:
        path: "{{ ssl_self_csr_path }}"
        privatekey_path: "{{ ssl_self_key_path }}"
  when: self_signed == 'yes'

- name: Generate self signed ssl
  openssl_certificate:
        provider: selfsigned
        path: "{{ ssl_self_cert_path }}"
        privatekey_path: "{{ ssl_self_key_path }}"
        csr_path: "{{ ssl_self_csr_path }}"
  when: self_signed == 'yes'

- name: Configure base apache2 config from template
  template:
        src: httpd.conf.j2
        dest: /etc/httpd/conf/httpd.conf
        backup: yes

- name: Configure virtual host for redirect
  template:
        src: http-server.conf.j2
        dest: "/etc/httpd/conf.d/http-{{ server_name }}.conf"
        backup: yes
  notify:
        - restart apache
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

- name: configure Virtual host for ssl
  template:
        src: https-server.conf.j2
        dest: "/etc/httpd/conf.d/https-{{ server_name }}.conf"
        backup: yes
  notify:
        - restart apache
  when: NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == ''

## Report-Only blocks nothing: it only logs violations (via webinfo's
## /csp-report.php) so a site can run a full analysis cycle before ever
## switching to the enforcing header. dbutils' util/csp/README.md documents
## that path; this role only ever installs the report-only file, never the
## enforcing one -- turning it into Content-Security-Policy on a specific
## site, once that site's own log is quiet, is a deliberate per-site change,
## not something a fresh build should do by default.
##
## Only installed on a fresh build or a host uslims_upgrade.php has already
## converted (listen_config_is_v2, registered earlier by config-lims-us3-user
## in this same play) -- an existing 4.2.0 host must see no new behavior
## from a run against it, and a brand-new CSP header is exactly that.
- name: Check whether the https vhost conf already exists (fresh install vs. existing host)
  ansible.builtin.stat:
    path: "/etc/httpd/conf.d/https-{{ server_name }}.conf"
  register: https_vhost_existed_already

- name: Install the Report-Only Content Security Policy
  ansible.builtin.copy:
        remote_src: yes
        src: "{{ user_home }}/us3/lims/database/utils/util/csp/csp-report-only.conf"
        dest: /etc/httpd/conf.d/lims-csp.conf
        owner: root
        group: root
        mode: '0644'
  notify:
        - restart apache
  when: >
        (NO_LIMS is undefined or NO_LIMS == false or NO_LIMS == '') and
        (not https_vhost_existed_already.stat.exists or listen_config_is_v2.rc == 0)
