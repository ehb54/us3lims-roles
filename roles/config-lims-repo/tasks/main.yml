---
# using dnf in a shell because we want the power tools repo to be persistent for epel 
- name: enable power tool for epel
  shell: dnf config-manager --set-enabled {{ powertools }}
  changed_when: false
  when: (ansible_facts['distribution'] == "CentOS" and ansible_facts['distribution_major_version'] == "8") or ansible_facts['os_family'] == "Rocky"

- name: install epel via greeling's role
  include_role:
          name: geerlingguy.repo-epel
          tasks_from: main
  # Oracle Linux 10+ uses Oracle's EPEL mirror (oracle-epel-release-elN, see the play's pre_tasks):
  # Fedora's EPEL 10 is built against a newer RHEL minor than the OL base
  when: not (ansible_facts['distribution'] == 'OracleLinux' and (ansible_facts['distribution_major_version'] | int) >= 10)
