---
## The schema-v1 host base and the overlay directory dbinst's loader expects
## (CONFIGURATION.md in the dbinst checkout). Installing these creates no
## instance by itself -- an instance only uses the base once its own
## config.php is the generated shim, which newinst's makeconfig.php decides
## per instance. Until then every existing instance keeps its complete
## legacy config.php and is unaffected.
- name: Create the dbinst configuration root
  ansible.builtin.file:
    path: "{{ dbinst_config_root }}"
    state: directory
    owner: us3
    group: "{{ www_user }}"
    mode: '0750'

## 2750, not group-writable: overlays are PHP the us3 daemons include, so a
## web-writable directory would let the web tier replace them. The setgid
## bit gives new overlays the web group without every writer having to set
## it explicitly.
- name: Create the dbinst instance overlay directory
  ansible.builtin.file:
    path: "{{ dbinst_config_root }}/instances"
    state: directory
    owner: us3
    group: "{{ www_user }}"
    mode: '2750'

- name: Render the dbinst schema-v1 host base
  ansible.builtin.template:
    src: dbinst-base.v1.php.j2
    dest: "{{ dbinst_config_root }}/dbinst-base.v1.php"
    owner: us3
    group: "{{ www_user }}"
    mode: '0640'
    validate: '/usr/bin/php -l %s'
