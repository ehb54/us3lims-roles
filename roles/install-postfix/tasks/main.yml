---
# tasks file for install-postfix

- name: Remove sendmail RedHat
  yum:
    name:
      - sendmail
    state: absent
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky" 

- name: Install postfix RedHat
  yum:
    name:
      - libgsasl
      - cyrus-sasl
      - cyrus-sasl-plain
      - cyrus-sasl-lib
      - postfix
      - mutt
      - alpine
    state: present
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky" 

- name: Remove sendmail Debian
  apt:
    name:
      - sendmail
    state: absent
  when: ansible_facts['os_family'] == "Debian"

- name: Install postfix Debian
  apt:
    name:
      - libsasl2-modules
      - postfix
      - mutt
      - alpine
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Create /etc/postfix/sasl directory
  file:
    path: /etc/postfix/sasl
    state: directory
    mode: '0755'

- name: Copy over sasl_passwd
  template: 
    src: sasl_passwd.j2
    dest: /etc/postfix/sasl/sasl_passwd
    mode: '0600'
  register: postfix_sasl_passwd

- name: Look for the sasl_passwd map
  ansible.builtin.stat:
    path: /etc/postfix/sasl/sasl_passwd.db
  register: postfix_sasl_db

# postmap rewrites the map every run; only when sasl_passwd changed or the map is missing
- name: Run postmap
  command:
    chdir: /etc/postfix/sasl
    cmd: postmap /etc/postfix/sasl/sasl_passwd
  when: postfix_sasl_passwd is changed or not postfix_sasl_db.stat.exists
  register: postfix_postmap

- name: Fix permissions of sasl_passwd
  file:
    path: "{{ item }}"
    owner: root
    group: root
    mode: '0600'
  with_items:
    - /etc/postfix/sasl/sasl_passwd.db
    - /etc/postfix/sasl/sasl_passwd

# postconf -e rewrites main.cf only when a value differs; compared before and after so postfix
# restarts only when its configuration changed, not on every run
- name: Read main.cf before configuring postfix
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf_before

- name: Configure postfix
  command:
    cmd: postconf -e {{ item }}
  with_items:
    - inet_interfaces=loopback-only
    - inet_protocols=ipv4
    - relayhost=[{{ postfix_relay_smtp_host }}]:{{ postfix_relay_smtp_port }}
    - smtp_use_tls=yes
    - smtp_sasl_password_maps=hash:/etc/postfix/sasl/sasl_passwd
    - smtp_sasl_auth_enable=yes
    - smtp_sasl_security_options=
    - smtp_tls_security_level=may
    - myhostname={{ postfix_hostname }}
    - mydomain={{ postfix_hostname }}
    - myorigin={{ postfix_hostname }}
    - mydestination=
  changed_when: false

- name: Read main.cf after configuring postfix
  ansible.builtin.stat:
    path: /etc/postfix/main.cf
  register: postfix_main_cf_after

- name: Set postfix permissions
  command:
    cmd: /usr/sbin/postfix set-permissions

- name: Postfix check
  command:
    cmd: postfix check

- name: Set postfix alternative for RedHat
  command:
    cmd: alternatives --set mta /usr/sbin/sendmail.postfix
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky" 

- name: Enable postfix
  service:
    name : postfix
    enabled: yes
    state: started

- name: Restart postfix for the new configuration
  service:
    name: postfix
    state: restarted
  when: >-
    postfix_main_cf_before.stat.checksum | default('') != postfix_main_cf_after.stat.checksum
    or postfix_postmap is changed
    
