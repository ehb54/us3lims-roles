---
# Refuses to let a run touch a repo checkout that is not on this site's declared release, instead
# of silently force-checking it out to whatever the playbook passes. Off unless
# the site sets site_release. Two identities, both required:
#   site_release:          the ref (branch or tag) every *_branch pulls, e.g. release-2026-Q3, v4.2.0
#   site_release_version:  the VERSION file that ref carries, e.g. 4.2.0
# A ref name and a VERSION are different things; comparing one variable with both refused every
# real ref name.
#
# Include this once per repo checkout, before its own git: task, with:
#   release_gate_dest:   the checkout's working directory
#   release_gate_label:  a short name for messages (e.g. "dbutils")
#   release_gate_branch: the branch/tag the upcoming git: task for this
#                        checkout will pull (e.g. "{{ utils_branch }}")
#
# The upcoming pull (release_gate_branch) is checked as well as the existing checkout: a
# site_release matching the old checkout with every *_branch pinned newer otherwise moved the
# code while the site's data stayed behind.

- block:
    - name: "{{ release_gate_label }}: refuse to continue without site_release_version"
      ansible.builtin.fail:
        msg: >-
          site_release is '{{ site_release }}' but site_release_version is not set. Set it to the
          VERSION that ref carries (e.g. 4.2.0); each checkout's VERSION file is checked against it.
      when: site_release_version | default('') | string | length == 0

    - name: "{{ release_gate_label }}: refuse to continue if the upcoming pull disagrees with site_release"
      ansible.builtin.fail:
        msg: >-
          {{ release_gate_label }} is about to be pulled to
          '{{ release_gate_branch }}', not this site's declared release
          '{{ site_release }}'. Refusing to touch it -- either this repo's
          own branch variable needs to track site_release, or site_release
          needs updating to match what this run actually intends to pull.
      when: release_gate_branch is defined and release_gate_branch != site_release
    - name: "{{ release_gate_label }}: check whether a checkout already exists"
      ansible.builtin.stat:
        path: "{{ release_gate_dest }}/.git"
      register: release_gate_git_dir

    - name: "{{ release_gate_label }}: read the branch or tag currently checked out"
      ansible.builtin.command:
        argv: [ git, -C, "{{ release_gate_dest }}", rev-parse, --abbrev-ref, HEAD ]
      register: release_gate_current
      changed_when: false
      when: release_gate_git_dir.stat.exists

    ## A detached HEAD (checked out to a tag, not a branch) reads back
    ## literally as "HEAD" from rev-parse --abbrev-ref -- fall back to an
    ## exact-match describe so a tag-pinned release still compares cleanly.
    - name: "{{ release_gate_label }}: resolve a detached HEAD to its tag"
      ansible.builtin.command:
        argv: [ git, -C, "{{ release_gate_dest }}", describe, --tags, --exact-match ]
      register: release_gate_current_tag
      changed_when: false
      failed_when: false
      when:
        - release_gate_git_dir.stat.exists
        - release_gate_current.stdout == "HEAD"

    ## The branch/tag check above only proves the checkout's ref is named
    ## right -- it says nothing about what's actually in the tree. A
    ## force-push, a rebase, or a stale fetch can leave a branch with the
    ## right name pointing at the wrong content, and the ref check alone
    ## would pass it. Every repo in this stack has carried a VERSION file
    ## at its root since 4.2.0 (uslims_upgrade.php's own step 0 reads it
    ## for exactly this, and trusts it over the ref name: "a VERSION file
    ## alone is not enough" there is about gridctl's own artifacts, not
    ## about preferring the branch name instead). Reading it here is the
    ## same "read a deployed VERSION" signal, just checked before the pull
    ## that would otherwise silently move a drifted checkout.
    - name: "{{ release_gate_label }}: read the checkout's own VERSION file"
      ansible.builtin.slurp:
        src: "{{ release_gate_dest }}/VERSION"
      register: release_gate_version_file
      failed_when: false
      when: release_gate_git_dir.stat.exists

    - name: "{{ release_gate_label }}: refuse to continue if the checkout has no readable VERSION"
      ansible.builtin.fail:
        msg: >-
          {{ release_gate_dest }} has no readable VERSION file. Every repo
          in this stack has carried one since 4.2.0 -- a missing file here
          is an unrecognized checkout, not an old one, and the branch-name
          check above cannot stand in for it.
      when:
        - release_gate_git_dir.stat.exists
        - release_gate_version_file.content is not defined

    - name: "{{ release_gate_label }}: refuse to continue if the checkout's VERSION disagrees with site_release_version"
      ansible.builtin.fail:
        msg: >-
          {{ release_gate_dest }}'s VERSION file says
          '{{ release_gate_version_file.content | b64decode | trim }}', not
          this site's declared release version '{{ site_release_version }}'
          ('{{ site_release }}'). Refusing to touch it: either the checkout
          is stale (a force-push or a rebase landed something else), or
          site_release_version needs updating to match what is deployed.
      when:
        - release_gate_git_dir.stat.exists
        - release_gate_version_file.content is defined
        - (release_gate_version_file.content | b64decode | trim) != (site_release_version | string)

    - name: "{{ release_gate_label }}: refuse to continue if the host is not on site_release"
      ansible.builtin.fail:
        msg: >-
          {{ release_gate_dest }} is on
          '{{ release_gate_current_tag.stdout | default(release_gate_current.stdout) }}',
          not this site's declared release '{{ site_release }}'. Refusing to touch it --
          either this host is running a different release than site_release says, or
          site_release needs updating to match. Not stopped: nothing here changes an
          existing checkout without this matching first.
      when:
        - release_gate_git_dir.stat.exists
        - (release_gate_current_tag.stdout | default(release_gate_current.stdout)) != site_release
  when: site_release is defined
