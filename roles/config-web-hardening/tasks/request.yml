---
# The host requests web_hardening_check_urls from itself. LD_PRELOAD is cleared because a host
# that sends its traffic through proxychains (LD_PRELOAD in /etc/environment, which sudo
# applies) would also send these requests to localhost through the tunnel.
- name: Request the check pages
  ansible.builtin.uri:
    url: "{{ item }}"
    method: GET
    follow_redirects: none
    validate_certs: false
    timeout: "{{ web_hardening_request_timeout | int }}"
    status_code: [200, 204, 301, 302, 303, 307, 308, 400, 401, 403, 404, 405, 500, 502, 503]
  environment:
    LD_PRELOAD: ""
  loop: "{{ web_hardening_check_urls }}"
  register: web_hardening_pages
  failed_when: false
  check_mode: false
