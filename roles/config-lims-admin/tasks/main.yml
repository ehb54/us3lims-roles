---
- set_fact:
    user_home: "/home"
  when: user_home is undefined

## Admin accounts
## are set up only at install; re-runs must not add or remove them. These
## two tasks used to run unconditionally on every single run, with
## state: present -- so an admin account an operator deliberately removed
## (userdel) came right back on the very next run, key and all. A plain
## "does the account already exist" check cannot tell "never created" from
## "created, then deliberately removed" apart (both read as absent) -- a
## marker file that, once created, is never removed by this role again is
## the same pattern cluster_config.php's own "first install only" check
## already established elsewhere in this playbook, here scoped to "has
## this role ever provisioned admin accounts on this host."
- name: Check whether admin accounts have already been provisioned once
  ansible.builtin.stat:
    path: /etc/lims-admin-accounts-provisioned
  register: lims_admin_accounts_provisioned

- name: Add users (first install only -- see the check above; removing one later is a deliberate, lasting choice)
  user:
    name: '{{ item }}'
    groups: wheel
    state: present
    home: '{{ user_home }}/{{ item }}'
  with_items:
    - demeler
    - alexey
    - ehb
    - saeed
  when: not lims_admin_accounts_provisioned.stat.exists

- name: Add authorized keys (first install only -- see the check above)
  authorized_key:
    user: '{{ item }}'
    key: "{{ lookup( 'file', '../files/{{ item }}') }}"
  with_items:
    - alexey
    - demeler
    - ehb
    - saeed
  when: not lims_admin_accounts_provisioned.stat.exists

- name: Record that admin accounts have now been provisioned once
  ansible.builtin.file:
    path: /etc/lims-admin-accounts-provisioned
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: not lims_admin_accounts_provisioned.stat.exists

- name: "Install emacs-nox via yum"
  yum:
    name: emacs-nox
    state: present
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

- name: "Install emacs-nox via apt"
  apt:
    name: emacs-nox
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: "Copy .emacs to ~/ehb"
  copy:
    src: files/dot_emacs
    dest: ~ehb/.emacs
    owner: ehb
    group: ehb
    mode: u=rw,g=r,o=r

- name: Creates directory
  file:
    path: ~ehb/bin
    state: directory

- name: "Copy items to ~ehb/bin"
  copy:
    src: 'files/{{ item }}'
    dest: "~ehb/bin/{{ item }}"
    owner: root
    group: root
    mode: u=rwx,g=rx,o=rx
  with_items:
    - e
    - s
    - lth
    - epath
