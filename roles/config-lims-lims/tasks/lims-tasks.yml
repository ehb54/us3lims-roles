---
- name: install depedencies
  dnf:
    name:
      - git
    update_cache: yes

- set_fact:
    common_branch: "{{ site_release | default(branch) }}"
  when: common_branch is undefined

- set_fact:
    webinfo_branch: "{{ site_release | default(branch) }}"
  when: webinfo_branch is undefined

- name: Add common directory to git safe directories
  command: git config --global --add safe.directory {{ www_common }}

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ www_common }}"
    release_gate_label: "us3lims_common"
    release_gate_branch: "{{ common_branch }}"

# Common dir.
- name: Clone commons repo
  git:
   repo: "{{ common_url }}"
   dest: "{{ www_common }}"
   version: "{{ common_branch }}"
   force: yes
  changed_when: false

## uslims_upgrade.php stamps a "## BEGIN uslims_upgrade.php settings" banner
## into global_config.php when it writes cluster/sizing/breaker settings
## there, and says so in the banner itself: "rerun the script rather than
## editing by hand". This task used to copy the plain template over
## global_config.php on every run regardless, overwriting that banner (and
## the sizing, pool and breaker settings inside it) with the un-upgraded
## defaults on the very next ansible run after an operator upgraded the host
## (round-13, us3lims-roles#24). Backing this off on the banner's presence
## fixed an upgraded host, but not a fresh-built one that has never been
## upgraded at all (round 15): config-lims-mpi-runtime's own task below
## writes real ppbj/env_script_lines into this same file on a fresh
## install's first run, but that host never gets the upgrade-script banner
## either, so every later re-run still saw no banner and copied the
## pristine template straight over those detected values -- ppbj observed
## going 16 (detected) -> 8 (template) -> 16 (re-detected, since the MPI
## task's own "fresh install only" gate happened to still read true from a
## stale pre-run fact) on successive runs. The actual question this task
## needs answered is "did this run just create the file, or has some
## earlier run (this role's own copy, or an operator's upgrade) already
## put something worth keeping there" -- answered by the same
## global_config_existed_already fact the MPI task below already uses for
## exactly this, not by grepping for one specific owner's marker.
- name: Check whether global_config.php exists yet (fresh install vs. an existing host)
  ansible.builtin.stat:
    path: "{{ www_common }}/global_config.php"
  register: global_config_existed_already

- name: copy global_config.php.template to global_config.php (first install only -- see the check above)
  ansible.builtin.copy:
   remote_src: yes
   src: "{{ www_common }}/global_config.php.template"
   dest: "{{ www_common }}/global_config.php"
   owner: us3
   group: us3
   mode: 0644
  when: not global_config_existed_already.stat.exists

## config-lims-mpi-runtime moved to its own entry in the top-level
## playbook, after build-mpich/build-us-mpi: it shells out to mpirun/us_mpi_analysis, neither
## of which exist yet at this point in the play -- this role runs before
## the roles that build them, so its own assert always failed on a fresh
## build. $global_config_existed_already, registered above, is a host fact
## and still readable from that later role in the same play. See
## UPGRADE-AND-INSTALL-MODEL.md.

## do we need this? - not any more
#- name: Run update_local.sh
#  command:
#    chdir: "{{ www_common }}/class_local"
#    cmd: ./update_local.sh

#- name: Template topmenu.php
#  template: 
#      src: topmenu.php.j2
#      dest: "{{ www_common }}/topmenu.php"
#  changed_when: false

# Web info dir.
- name: Add common directory to git safe directories
  command: git config --global --add safe.directory {{ www_uslims }}

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ www_uslims }}"
    release_gate_label: "us3lims_webinfo"
    release_gate_branch: "{{ webinfo_branch }}"

- name: clone webinfo repo
  git:
   repo: "{{ webinfo_url }}"
   dest: "{{ www_uslims }}"
   version: "{{ webinfo_branch }}"

## backup: yes has no way to redirect
## where it writes (ansible.builtin.template's own option is a bare
## boolean) -- it always drops the timestamped copy right next to the
## file, which here is inside webinfo's own git checkout. Git already
## tracks every actual repo file's history; a backup ansible itself wrote
## is just an ever-accumulating untracked file in a tree uslims_git_info.php
## otherwise manages cleanly. config.php itself is template-generated, not
## a file an operator hand-edits in place, so there is nothing here worth
## keeping a side-copy of anyway.
- name: Template webinfo config
  template:
    src: "webinfo-config.php.j2"
    dest: "{{ www_uslims }}/config.php"

- include_role:
    name: config-lims-dbinst-base

- set_fact:
    newinst_branch: "{{ site_release | default(branch) }}"
  when: newinst_branch is undefined

# Newlims dir.
- name: Add common directory to git safe directories
  command: git config --global --add safe.directory {{ www_newlims }}

- include_role:
    name: release-gate
  vars:
    release_gate_dest: "{{ www_newlims }}"
    release_gate_label: "us3lims_newinst"
    release_gate_branch: "{{ newinst_branch }}"

- name: Clone newinst repo
  git:
    repo: "{{ newinst_url }}"
    version: "{{ newinst_branch }}"
    dest: "{{ www_newlims }}"

## Same reasoning as webinfo's own config
## template just above -- the backup would land inside newinst's git
## checkout, which git already tracks the real history of.
- name: Template newinst config
  template:
    src: "newinst-config.php.j2"
    dest: "{{ www_newlims }}/config.php"

- name: Install cluster_config.php local submit only
  copy:
    src: "cluster_config.php.localonly"
    dest: "{{ www_newlims }}/cluster_config.php"
    mode: '0644'
    owner: "us3"
  when: submit_localonly|default(false)

- name: Install cluster_config.php remote submit only
  copy:
    src: "cluster_config.php.remoteonly"
    dest: "{{ www_newlims }}/cluster_config.php"
    mode: '0644'
    owner: "us3"
  when: submit_remoteonly|default(false)

- name: Install cluster_config.php local and remote submit
  copy:
    src: "cluster_config.php.localandremote"
    dest: "{{ www_newlims }}/cluster_config.php"
    mode: '0644'
    owner: "us3"
  when: submit_localandremote|default(false)

- name: Create uslims3_data directory
  file:
    path: "{{ www_uslims3_data }}"
    state: directory
    mode: '0755'
    owner: "us3"
    group: "{{ www_user }}"
    
# looks like one day if we complain enough, git will support chowning within the git module
# https://github.com/ansible/ansible/issues/51601
#
- name: change permissions because ansible >:(
  file:
    path: "{{ www_base }}"
    owner: "us3"
    group: "{{ www_user }}"
    recurse: yes
    state: directory
  changed_when: false

## Runs uslims_upgrade.php itself rather than reimplementing any of its
## steps here, so a fresh build converges through the exact same logic an
## existing host's upgrade does -- including the circuit-breaker, ssh-
## control and elog directories, and the Report-Only CSP install (step 7,
## idempotent: once installed, every later run reports it and changes
## nothing). This used to say "the CSP install above" --
## stale ever since config-lims-apache's own, separately-scoped CSP copy
## task was removed in favor of this one, the sole installer now; there
## is no CSP task left anywhere above this one in this role to point at.
## --accept-host-keys is deliberately not passed:
## trusting a freshly scanned host key is a decision this run should not
## make unattended, same reasoning as the script's own comment on it. A
## default template install never needs it (its only active cluster entry
## is 'localhost' => true), and a site with real remote clusters configured
## sets those up through step 4's own confirm() prompts by hand.
##
## This task itself runs on
## BOTH a fresh install and an upgrade, deliberately -- it is not only a
## one-time migration (which a fresh host would have nothing to migrate
## for), it is also the one place that provisions the breaker/ssh-control/
## elog directories and the CSP policy every host needs, migrated or not.
## Skipping it on a fresh host would skip that provisioning too. The two
## real problems were ordering and a missing script: (1) the host staying
## idle through THIS run's own first call, which start-lims-services
## (moved to the end of the play) guarantees regardless of fresh/upgraded;
## (2) an older dbutils checkout (a 4.2.0 host pinned to an old branch for
## compatibility testing) not having this script at all -- checked here,
## so the play continues with a clear note instead of failing outright on
## "Could not open input file".
##
## (1) above only ever covered one
## play's first call -- it is also start-lims-services that starts
## us3-listen and writes the LIMS cron entries, and that state carries
## into the NEXT run untouched, since nothing before this point in a later
## run ever stops them again. So every re-run on an already-converged host
## hit the exact same "not idle" refusal moving start-lims-services
## solved only for a play's own first run. This play now re-idles itself
## immediately before the call, rather than assuming a prior run left the
## host in a state this one can still rely on. See
## UPGRADE-AND-INSTALL-MODEL.md.
- name: Check whether uslims_upgrade.php exists (an older dbutils checkout, e.g. a 4.2.0-pinned host, may not have it)
  ansible.builtin.stat:
    path: "{{ user_home }}/us3/lims/database/utils/uslims_upgrade.php"
  register: uslims_upgrade_script

## Stopping the daemon
## alone is not enough -- uslims_upgrade.php's idle check separately
## refuses on any UNCOMMENTED crontab line matching its own LIMS-job
## pattern (live_lims_crontabs(), uslims_upgrade.php), and start-lims-
## services' cron-tasks.yml (cluster_status, update_notice) and config-
## lims-backup/config-aucsol-backup (the nightly backup job) all write
## exactly such lines, active, on every prior run. A plain comment-out/
## uncomment-after pair here would misfire against cron-tasks.yml's own
## "deliberately disabled" detection -- a line this task left commented
## would be indistinguishable from one an operator deliberately disabled,
## so a later run would never re-enable it. Snapshotting the whole file
## and restoring it verbatim afterward (not a pattern-based restore)
## sidesteps that ambiguity entirely: nothing here needs to know, or
## guess, which lines it is safe to turn back on.
- name: Snapshot /etc/crontab before idling it for uslims_upgrade.php
  ansible.builtin.copy:
    src: /etc/crontab
    dest: /etc/crontab.pre-upgrade-idle
    remote_src: yes
    mode: preserve
  when: uslims_upgrade_script.stat.exists

- name: Comment out any active LIMS cron entry in /etc/crontab before uslims_upgrade.php (restored verbatim in 'always', regardless of outcome)
  ansible.builtin.replace:
    path: /etc/crontab
    regexp: '^(?!\s*#)(.*\b(?:gridctl(?:_pro|_dev)?\.php|cluster_status\.php|update_notice\.php|listen\.php|jobmonitor\.php|uslims_daily_backup\.php|uslims_daily_rsync\.php|save-jobstats\.sh)\b.*)$'
    replace: '#\1'
  when: uslims_upgrade_script.stat.exists

- name: Check whether us3-listen is currently active (a prior run's start-lims-services, not necessarily this one)
  ansible.builtin.command: systemctl is-active us3-listen
  register: us3_listen_active_before_upgrade
  changed_when: false
  failed_when: false
  when: uslims_upgrade_script.stat.exists

## Graceful (drains in-flight work), not "systemctl stop": services.php
## stop is the documented shutdown path (uslims_upgrade.php --help's own
## procedure step 1), and the idle check this feeds into runs on every
## listen-config.php this role ever templates (version 2, from the moment
## config-lims-apache/config-lims-us3-user first lay the host out), so
## services.php is always the right tool here, never the pre-v2 fallback
## uslims_upgrade.php's own refusal message names for a host this role has
## never touched. start-lims-services (end of this same play) starts
## everything back up regardless of whether uslims_upgrade.php below finds
## anything to change.
- name: Idle the host for uslims_upgrade.php (stop the gridctl services gracefully; start-lims-services below brings them back regardless of outcome)
  become: yes
  become_user: us3
  ansible.builtin.command:
    chdir: "{{ user_home }}/us3/lims/bin"
    cmd: "php services.php stop"
  when: uslims_upgrade_script.stat.exists and us3_listen_active_before_upgrade.stdout | default('') == 'active'
  changed_when: true

## block/always, not a plain task list: a genuine failure (not the
## tolerated "not idle" case just below) must still restore the crontab
## snapshot before the play stops, or a hard failure here would leave
## every LIMS cron entry disabled behind it -- worse than the "not idle"
## refusal this is meant to fix.
- block:
    - name: Converge the host through uslims_upgrade.php (breaker/ssh-control/elog directories, managed config blocks, CSP)
      ansible.builtin.command:
        chdir: "{{ user_home }}/us3/lims/database/utils"
        cmd: "php uslims_upgrade.php --apply --yes --www {{ www_base }}"
      register: uslims_upgrade_result
      changed_when: uslims_upgrade_result.rc == 0 and 'Nothing to change' not in uslims_upgrade_result.stdout
      ## A refusal because the host is STILL not idle after the idle step
      ## just above means something outside this play's control is using
      ## it (a manually-started daemon, a job genuinely in flight) --
      ## noted below, not a reason to fail the whole play; every other
      ## non-zero exit is a real problem and still fails it. error_exit()
      ## (utility.php) writes that message to the real PHP STDERR stream,
      ## not stdout -- checked against .stdout, this phrase is never found
      ## there at all, so the tolerance below never actually fired; every
      ## "not idle" refusal hard-failed the play instead.
      failed_when: uslims_upgrade_result.rc != 0 and 'the host is not idle' not in uslims_upgrade_result.stderr

    - name: Note that uslims_upgrade.php refused because the host is genuinely busy (outside this play's control)
      ansible.builtin.debug:
        msg: "uslims_upgrade.php found the host still not idle after stopping this role's own services -- something else is using it; rerun once it is clear."
      when: uslims_upgrade_result.rc != 0 and 'the host is not idle' in uslims_upgrade_result.stderr
  always:
    - name: Restore /etc/crontab exactly as it was before idling it for uslims_upgrade.php
      ansible.builtin.copy:
        src: /etc/crontab.pre-upgrade-idle
        dest: /etc/crontab
        remote_src: yes
        mode: preserve

    - name: Remove the crontab snapshot
      ansible.builtin.file:
        path: /etc/crontab.pre-upgrade-idle
        state: absent
  when: uslims_upgrade_script.stat.exists

- name: Note that uslims_upgrade.php was skipped (dbutils checkout predates it)
  ansible.builtin.debug:
    msg: "{{ user_home }}/us3/lims/database/utils has no uslims_upgrade.php -- skipping the host convergence step; pin utils_branch/site_release to 4.3.0 or newer to run it."
  when: not uslims_upgrade_script.stat.exists
