---
## The release this playbook installs unless the site declares its own. Role defaults, so the
## inventory, host_vars and -e all take precedence; the play's vars: would override the first two.
site_release: "release-2026-Q2"
## The VERSION file site_release carries; release-gate compares each checkout with it. Empty for a
## release the site chose itself, so the play's refusal asks for the version instead of assuming this one.
site_release_version: "{{ '4.1.0' if site_release == 'release-2026-Q2' else '' }}"
