---

- name: move old us if qt_force_rebuild is defined
  command: mv /opt/ultrascan3 /opt/ultrascan3_qt_rebuild_backup_{{ ansible_date_time.epoch }}
  args:
    removes: /opt/ultrascan3
  when: qt_force_rebuild is defined

- name: Check if us3 already installed, using /opt/ultrascan3/bin/us as a proxy
  stat: 
    path: /opt/ultrascan3/bin/us
  register: us_installed_details

## ultrascan-tickets#1314: on an OS-upgrade converge (lims_os_upgrade) /opt/ultrascan3 is the
## checkout the host already had, recompiled in place against this run's Qt and Qwt: the git
## task below leaves it alone, the old build's objects are removed first, and makeall.sh and
## makesomo.sh build it again. Only when us or us3_somo does not already load every Qt library
## from /opt/qt-{{ qt_version }}/lib (with the library path gui.j2 and us_env.sh set), so a
## rerun after a good rebuild compiles nothing.
- name: OS-upgrade converge, find the ultrascan3 programs not built against Qt {{ qt_version }}
  ansible.builtin.shell: |
    set -o pipefail
    export LD_LIBRARY_PATH=/opt/ultrascan3/lib:/opt/qt-{{ qt_version }}/lib:/opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}/lib
    for b in /opt/ultrascan3/bin/us /opt/ultrascan3/bin/us3_somo; do
      [ -x "$b" ] || { echo "$b: missing"; continue; }
      ldd "$b" | awk -v b="$b" -v q="/opt/qt-{{ qt_version }}/lib/" '/not found/ || (/libQt/ && index($3, q) != 1) { print b ":" $0 }'
    done
  args:
    executable: /bin/bash
  register: us3_os_upgrade_stale
  changed_when: false
  when: lims_os_upgrade | default(false) | bool

- name: Note whether this OS-upgrade converge recompiles /opt/ultrascan3
  ansible.builtin.set_fact:
    us3_os_upgrade_rebuild: "{{ (lims_os_upgrade | default(false) | bool) and (us3_os_upgrade_stale.stdout | default('') | length > 0) }}"

- name: Say why /opt/ultrascan3 is recompiled
  ansible.builtin.debug:
    msg: "{{ us3_os_upgrade_stale.stdout_lines }}"
  when: us3_os_upgrade_rebuild | bool

## Only what ultrascan3's .gitignore lists as build output: obj/ and moc/ directories, *.o,
## moc_*.cpp and moc_predefs.h, qwtplot3d's tmp/, and qmake's own output, the untracked
## Makefiles it generated and its .qmake.stash files. An old Makefile runs the old qmake when
## make finds it out of date (makesomo.sh reuses us3_config's), and a .qmake.stash keeps the
## old compiler's version and include directories, which qmake reuses rather than probing the
## new compiler. No source file is touched, and the check after it fails the run if a tracked
## file went missing. bin/ and lib/ stay: their programs and libraries are relinked over, and
## bin/ also holds what other tasks install there (rasmol).
- name: List the tracked files already missing from /opt/ultrascan3, before its old objects are removed
  ansible.builtin.command: git -c safe.directory=/opt/ultrascan3 -C /opt/ultrascan3 ls-files --deleted  # noqa: command-instead-of-module
  register: us3_os_upgrade_deleted_before
  changed_when: false
  become: false
  when: us3_os_upgrade_rebuild | bool

- name: Remove the old build's output from /opt/ultrascan3, failing if a tracked file goes missing
  ansible.builtin.shell: |
    set -e
    find /opt/ultrascan3 \( -path /opt/ultrascan3/.git -o -path /opt/ultrascan3/vcpkg \) -prune -o \
      -type d \( -name obj -o -name moc -o -path /opt/ultrascan3/qwtplot3d/tmp \) -prune -exec rm -rf {} + -o \
      -type f \( -name '*.o' -o -name 'moc_*.cpp' -o -name moc_predefs.h \) -exec rm -f {} +
    qmake_output=$(git -c safe.directory=/opt/ultrascan3 ls-files --others -- ':(glob)**/Makefile*' ':(glob)**/.qmake.stash')
    while IFS= read -r f; do
      [ -n "$f" ] || continue
      case "${f##*/}" in
        Makefile*) grep -q -m 1 '^# Generated by qmake' < <(head -n 5 "$f") || continue ;;
      esac
      rm -f -- "$f"
    done <<< "$qmake_output"
    git -c safe.directory=/opt/ultrascan3 ls-files --deleted
  args:
    chdir: /opt/ultrascan3
    executable: /bin/bash
  register: us3_os_upgrade_clean
  become: false
  changed_when: true
  failed_when: >-
    us3_os_upgrade_clean.rc != 0
    or (us3_os_upgrade_clean.stdout_lines | difference(us3_os_upgrade_deleted_before.stdout_lines)) | length > 0
  when: us3_os_upgrade_rebuild | bool

## bin/ need not be the tree owner's: on a first install install-rasmol's bin64 link task leaves
## it owned by us3. makeall.sh relinks the programs already there, but makesomo.sh's rsync and the
## us.sh templates create files in bin/, so for the rebuild bin/ is given the owner of
## /opt/ultrascan3 (the user the builds run as), and its own owner and group back after it. If
## the rebuild fails, bin/ keeps the tree's owner, and a rerun takes that as bin/'s owner.
## Only the owner and group change (no mode: bin/ keeps its own).
- name: OS-upgrade converge, look up who owns /opt/ultrascan3 and its bin/
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/ultrascan3
    - /opt/ultrascan3/bin
  register: us3_os_upgrade_owners
  when: us3_os_upgrade_rebuild | bool

- name: OS-upgrade converge, give /opt/ultrascan3/bin to the owner of /opt/ultrascan3 for the rebuild  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: /opt/ultrascan3/bin
    state: directory
    owner: "{{ us3_os_upgrade_owners.results[0].stat.pw_name }}"
    group: "{{ us3_os_upgrade_owners.results[0].stat.gr_name }}"
  when:
    - us3_os_upgrade_rebuild | bool
    - us3_os_upgrade_owners.results[1].stat.exists

- name: Install environment-modules RedHat
  yum:
    name:
      - environment-modules
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

- name: Install environment-modules Debian
  yum:
    name:
      - environment-modules
  when: ansible_facts['os_family'] == "Debian"
  
- name: Link /etc/modulefiles to /usr/share/modules/modulefiles for Debian
  file: 
    src: /usr/share/modules/modulefiles
    dest: /etc/modulefiles
    state: link
  when: ansible_facts['os_family'] == "Debian"

- name: Create us-gui modulefiles directory
  file: 
    path: /etc/modulefiles/ultrascan/
    mode: '0755'
    state: directory

- name: Copy over template files for ultrascan/gui modulefiles
  template: 
    src: gui.j2
    dest: /etc/modulefiles/ultrascan/gui
    mode: '0644'

- name: Copy over template files for ultrascan/gui-build modulefiles for Debian
  template: 
    src: gui-build.j2
    dest: /etc/modulefiles/ultrascan/gui-build
    mode: '0644'
  when: not us3_gcc_toolset_modulefile

- name: Copy over template files for ultrascan/gui-build modulefiles for RedHat
  template:
    src: gui-build-gcc-toolset-9.j2
    dest: /etc/modulefiles/ultrascan/gui-build
    mode: '0644'
  when: us3_gcc_toolset_modulefile

- name: Copy over template files for ultrascan/home-gui-build modulefiles for Debian
  template:
    src: home-gui-build.j2
    dest: /etc/modulefiles/ultrascan/home-gui-build
    mode: '0644'
  when: not us3_gcc_toolset_modulefile

- name: Copy over template files for ultrascan/home-gui-build modulefiles for RedHat
  template:
    src: home-gui-build-gcc-toolset-9.j2
    dest: /etc/modulefiles/ultrascan/home-gui-build
    mode: '0644'
  when: us3_gcc_toolset_modulefile

- name: Install, configure and compile us3
  become: no
  block:

    - name: install git dependency RedHat
      dnf:
        name:
          - git
        update_cache: yes
      become: yes
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

    ## What ultrascan3's qmake build links beyond Qt and Qwt (-larchive, -lmysqlclient, -lGLU, -lX11 -lXau,
    ## -lssl -lcrypto, -lz), and rsync for makesomo.sh. build-qt/build-qt6 install these only when they build Qt, so with a Qt already
    ## in /opt (an earlier run, or a copy) makeall.sh failed in utils (archive_entry.h) and built almost nothing.
    - name: Install the ultrascan3 build dependencies for RedHat
      dnf:
        name:
          - "{{ 'gcc-toolset-9' if (ansible_facts['distribution_major_version'] | int) < 10 else 'gcc-c++' }}"
          - make
          - libarchive-devel
          - mariadb-devel
          - mesa-libGL-devel
          - mesa-libGLU-devel
          - libX11-devel
          - libXau-devel
          - openssl-devel
          - zlib-devel
          # makesomo.sh copies the SOMO programs into /opt/ultrascan3/bin with rsync
          - rsync
        enablerepo: "{{ powertools | default(omit) }}"
        state: present
      become: yes
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

    - name: install git dependency Debian
      apt:
        name:
          - git
        state: present
      become: yes
      when: ansible_facts['os_family'] == "Debian"

    - name: Temporarily change /opt to allow the remote user to create a directory
      file:
        path: /opt
        mode: '0777'
      become: yes
      become_user: root
      
    - name: Git clone ultrascan3 repository
      git:
       repo: "{{ us3_repo }}"
       version: "{{ us3_branch }}"
       dest: "/opt/ultrascan3"
       update: "{{ not (lims_os_upgrade | default(false) | bool) }}"   # ultrascan-tickets#1314: an OS-upgrade converge leaves the checkout as it is
       umask: '0022'
    
    - name: Revert /opt to standard ownership
      file:
        path: /opt
        mode: '0755'
      become: yes
      become_user: root

    - name: Copy over local.pri
      template: 
           src: local.pri.j2
           dest: /opt/ultrascan3/local.pri
    
    - name: make ultrascan3 for RedHat using us3_gcc_enable (gcc-toolset-9 on EL8, system GCC on EL10)
      shell:
        chdir: /opt/ultrascan3
        cmd: umask 022 && {{ us3_gcc_enable }}gcc -v 2> build.gccversion && ./makeall.sh -j {{ cores_for_parallel_compile }} > build.stdout 2> build.stderr
      environment: 
        ## Qt 6 installs qhelpgenerator (makeall.sh's doc/manual step, qch) in libexec, not bin
        PATH: /opt/qt-{{ qt_version }}/bin/:/opt/qt-{{ qt_version }}/libexec:/usr/bin:/usr/local/bin:/bin
        QTDIR: /opt/qt-{{ qt_version }}
        QWTDIR: /opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}
    
        US3DIR: /opt/ultrascan3
        QTBIN: /opt/qt-{{ qt_version }}/bin
        QTLIB: /opt/qt-{{ qt_version }}/lib
        QTINC: /opt/qt-{{ qt_version }}/include
        US3BIN: /opt/ultrascan3/bin
        US3LIB: /opt/ultrascan3/lib
        us3 : /opt/ultrascan3
#        LD_LIBRARY: ${US3LIB}:${QTLIB}:${QWTLIB}:${OLPATH}:${USDIR}
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

    - name: make ultrascan3 for Debian
      shell:
        chdir: /opt/ultrascan3
        cmd: umask 022 && ./makeall.sh -j {{ cores_for_parallel_compile }} > build.stdout 2> build.stderr
      environment: 
        ## Qt 6 installs qhelpgenerator (makeall.sh's doc/manual step, qch) in libexec, not bin
        PATH: /opt/qt-{{ qt_version }}/bin/:/opt/qt-{{ qt_version }}/libexec:/usr/bin:/usr/local/bin:/bin
        QTDIR: /opt/qt-{{ qt_version }}
        QWTDIR: /opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}
    
        US3DIR: /opt/ultrascan3
        QTBIN: /opt/qt-{{ qt_version }}/bin
        QTLIB: /opt/qt-{{ qt_version }}/lib
        QTINC: /opt/qt-{{ qt_version }}/include
        US3BIN: /opt/ultrascan3/bin
        US3LIB: /opt/ultrascan3/lib
        us3 : /opt/ultrascan3
#        LD_LIBRARY: ${US3LIB}:${QTLIB}:${QWTLIB}:${OLPATH}:${USDIR}
      when: ansible_facts['os_family'] == "Debian"

    - name: Stop on makeall.sh build errors
      ansible.builtin.include_tasks: makeall-check.yml

  when: us_installed_details.stat.exists == false or qt_force_rebuild is defined or us3_os_upgrade_rebuild | bool

- name: Check if us_somo already installed, using /opt/ultrascan3/bin/us3_somo as a proxy
  stat: 
    path: /opt/ultrascan3/bin/us3_somo
  register: us_somo_installed_details

- name: Install, configure and compile us_somo
  become: no
  block:

    - name: Clean up build_somo.stdout, .stderr
      file:
        path: "{{ item }}"
        state: absent
      with_items:
        - /opt/ultrascan3/build_somo.stdout
        - /opt/ultrascan3/build_somo.stderr

    - name: copy over local.pri
      template: 
        src: somo.local.pri.j2
        dest: /opt/ultrascan3/us_somo/develop/local.pri
    
    - name: Extra qmakes for RedHat using us3_gcc_enable (gcc-toolset-9 on EL8, system GCC on EL10)
      shell:
        chdir: /opt/ultrascan3/us_somo/develop/{{ item }}
        cmd: "{{ us3_gcc_enable }}/opt/qt-{{ qt_version }}/bin/qmake {{ item }}.pro"
      with_items:
        - us_admin
        - us_saxs_cmds_t
        - us3_hydrodyn
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

    - name: Extra qmakes for Debian
      shell:
        chdir: /opt/ultrascan3/us_somo/develop/{{ item }}
        cmd: /opt/qt-{{ qt_version }}/bin/qmake {{ item }}.pro
      with_items:
        - us_admin
        - us_saxs_cmds_t
        - us3_hydrodyn
      when: ansible_facts['os_family'] == "Debian"

    - name: Make somo for RedHat using us3_gcc_enable (gcc-toolset-9 on EL8, system GCC on EL10)
      shell:
        chdir: /opt/ultrascan3
        cmd: umask 022 && {{ us3_gcc_enable }}./makesomo.sh -j {{ cores_for_parallel_compile }} >> build_somo.stdout 2>> build_somo.stderr
      environment: 
        PATH: /opt/qt-{{ qt_version }}/bin/:/usr/bin:/usr/local/bin:/bin
        QTDIR: /opt/qt-{{ qt_version }}
        QWTDIR: /opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}
    
        US3DIR: /opt/ultrascan3
        QTBIN: /opt/qt-{{ qt_version }}/bin
        QTLIB: /opt/qt-{{ qt_version }}/lib
        QTINC: /opt/qt-{{ qt_version }}/include
        US3BIN: /opt/ultrascan3/bin
        US3LIB: /opt/ultrascan3/lib
        us3 : /opt/ultrascan3
        ULTRASCAN:  /opt/ultrascan3/
#        LD_LIBRARY: ${US3LIB}:${QTLIB}:${QWTLIB}:${OLPATH}:${USDIR}
      when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

    - name: Make somo for Debian
      shell:
        chdir: /opt/ultrascan3
        cmd: umask 022 && ./makesomo.sh -j {{ cores_for_parallel_compile }} >> build_somo.stdout 2>> build_somo.stderr
      environment: 
        PATH: /opt/qt-{{ qt_version }}/bin/:/usr/bin:/usr/local/bin:/bin
        QTDIR: /opt/qt-{{ qt_version }}
        QWTDIR: /opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}
    
        US3DIR: /opt/ultrascan3
        QTBIN: /opt/qt-{{ qt_version }}/bin
        QTLIB: /opt/qt-{{ qt_version }}/lib
        QTINC: /opt/qt-{{ qt_version }}/include
        US3BIN: /opt/ultrascan3/bin
        US3LIB: /opt/ultrascan3/lib
        us3 : /opt/ultrascan3
        ULTRASCAN:  /opt/ultrascan3/
#        LD_LIBRARY: ${US3LIB}:${QTLIB}:${QWTLIB}:${OLPATH}:${USDIR}
      when: ansible_facts['os_family'] == "Debian"

    - name: Stop on makesomo.sh build errors
      ansible.builtin.include_tasks: makesomo-check.yml

    - name: Make convenience us.sh, us_somo.sh us_env.sh
      template: 
        src: "{{ item }}.j2"
        dest: /opt/ultrascan3/bin/{{ item }}
        mode: '0755'
      with_items:
        - us.sh
        - us_somo.sh
        - us_env.sh

  when: us_somo_installed_details.stat.exists == false or qt_force_rebuild is defined or us3_os_upgrade_rebuild | bool

- name: OS-upgrade converge, give /opt/ultrascan3/bin its own owner and group back  # noqa: risky-file-permissions
  ansible.builtin.file:
    path: /opt/ultrascan3/bin
    state: directory
    owner: "{{ us3_os_upgrade_owners.results[1].stat.pw_name }}"
    group: "{{ us3_os_upgrade_owners.results[1].stat.gr_name }}"
  when:
    - us3_os_upgrade_rebuild | bool
    - us3_os_upgrade_owners.results[1].stat.exists

- name: Check that the in-place rebuild left no program on the old Qt (OS-upgrade converge)
  ansible.builtin.shell: |
    set -o pipefail
    export LD_LIBRARY_PATH=/opt/ultrascan3/lib:/opt/qt-{{ qt_version }}/lib:/opt/qt-{{ qt_version }}-qwt-{{ qwt_version }}/lib
    for b in /opt/ultrascan3/bin/us /opt/ultrascan3/bin/us3_somo; do
      [ -x "$b" ] || { echo "$b: missing"; continue; }
      ldd "$b" | awk -v b="$b" -v q="/opt/qt-{{ qt_version }}/lib/" '/not found/ || (/libQt/ && index($3, q) != 1) { print b ":" $0 }'
    done
  args:
    executable: /bin/bash
  register: us3_os_upgrade_after
  changed_when: false
  failed_when: us3_os_upgrade_after.rc != 0 or us3_os_upgrade_after.stdout | length > 0
  when: us3_os_upgrade_rebuild | bool

- name: Install dependencies to build documentation for us3 for RedHat
  yum:
    name:
      - perl-Template-Toolkit
    state: present
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

- name: Install dependencies to build documentation for us3 for Debian
  yum:
    name:
      - libtemplate-perl
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: Check for us3 documentation requirements.txt
  stat:
    path: /opt/ultrascan3/doc/manual/source/requirements.txt
  register: us3_doc_requirements

- name: Install pip3 requirements to build documentation for us3 for RedHat
  shell:
    chdir: /opt/ultrascan3/doc/manual/source
    cmd: umask 022 && python3.12 -m ensurepip && python3.12 -m pip install -r requirements.txt
  when:
    - us3_doc_requirements.stat.exists
    - ansible_facts['os_family'] in ["RedHat", "Rocky"]

- name: Create temporary bin directory
  file:
    path: /tmp/python_bin
    state: directory

- name: Create symlink for Makefile to find
  file:
    src: /usr/bin/python3.12
    dest: /tmp/python_bin/python3
    state: link

- name: Build documentation for us3 for RedHat using us3_gcc_enable (gcc-toolset-9 on EL8, system GCC on EL10)
  shell:
    chdir: /opt/ultrascan3/doc/manual
    cmd: umask 022 && {{ us3_gcc_enable }}gcc -v 2> build_doc.gccversion && make -j1 > build_doc.stdout 2> build_doc.stderr
  environment: 
    ## Qt 6 installs qhelpgenerator (used by the doc Makefile's "qch" target) in libexec, not bin
    PATH: /tmp/python_bin:/opt/qt-{{ qt_version }}/bin/:/opt/qt-{{ qt_version }}/libexec:/usr/bin:/usr/local/bin:/bin
  when: ansible_facts['os_family'] == "RedHat" or ansible_facts['os_family'] == "Rocky"

- name: Build documentation for us3 for Debian
  shell:
    chdir: /opt/ultrascan3/doc/manual
    cmd: umask 022 && gcc -v 2> build_doc.gccversion && make -j1 > build_doc.stdout 2> build_doc.stderr
  environment: 
    ## Qt 6 installs qhelpgenerator (used by the doc Makefile's "qch" target) in libexec, not bin
    PATH: /tmp/python_bin:/opt/qt-{{ qt_version }}/bin/:/opt/qt-{{ qt_version }}/libexec:/usr/bin:/usr/local/bin:/bin
  when: ansible_facts['os_family'] == "Debian"

- name: Create group for us3
  group:
    name: us3
    state: present

- name: Create the ultrascan3 user
  user:
    name: us3
    comment: ultrascan3 system user
    group: us3
    shell: /bin/bash
    state: present

- name: Copy assistant to us3/bin
  copy:
    src: /opt/qt-{{ qt_version }}/bin/assistant
    remote_src: yes
    dest: /opt/ultrascan3/bin/assistant
    owner: us3
    group: us3
    mode: preserve

- name: Symlink docs for somo
  file:
    src: "/opt/ultrascan3/us_somo/somo/doc"
    dest: "/opt/ultrascan3/somo/doc"
    state: link

- name: Copy zz-us3.sh to /etc/profile.d
  copy:
    src: zz-us3.sh
    dest: /etc/profile.d/zz-us3.sh
    owner: root
    group: root
    mode: '0644'

# replaced by zz-us3.sh, which runs after Lmod default-module scripts (ultrascan-tickets#1199)
- name: Remove the old /etc/profile.d/us3.sh
  file:
    path: /etc/profile.d/us3.sh
    state: absent

- name: Check if rasmol already installed, using /opt/ultrascan3/bin/rasmol
  stat: 
    path: /opt/ultrascan3/bin/rasmol
  register: rasmol_installed

- name: Install rasmol
  include_role:
    name: install-rasmol
  when: rasmol_installed.stat.exists == false

