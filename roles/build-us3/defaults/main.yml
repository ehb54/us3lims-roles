---
# defaults file for build-us3

# git url ultrascan3 is cloned from, override with -e "us3_repo=..." to build us3_branch from a fork
us3_repo: "https://github.com/ehb54/ultrascan3.git"

# EL10 ships no gcc-toolset-9 (only gcc-toolset-15; system GCC is 14): build with the system GCC there
us3_gcc_enable: "{{ '' if (ansible_facts['distribution_major_version'] | int) >= 10 else '. /opt/rh/gcc-toolset-9/enable && ' }}"
us3_gcc_toolset_modulefile: "{{ ansible_facts['os_family'] in ['RedHat', 'Rocky'] and (ansible_facts['distribution_major_version'] | int) < 10 }}"
