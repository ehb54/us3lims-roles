---
- hosts: example-host
  remote_user: usadmin

  pre_tasks:
# uncomment to get all ansible_facts for target host
#      - name: Print all available facts
#        ansible.builtin.debug:
#          var: ansible_facts

      - name: set www_user for Debian
        set_fact:
          www_user: "www-data"
        when: ansible_os_family == "Debian"

      - name:  set www_user for RedHat
        set_fact:
          www_user: "apache"
        when: ansible_os_family == "RedHat"

      - name: disable selinux
        selinux:
           state: disabled

      - name: update system
        yum: name=* state=latest
        when: ansible_facts['os_family'] == "RedHat"

      - name: install EPEL repo for CentOS
        yum: name=epel-release state=present
        when: ansible_facts['distribution'] == "CentOS"

      - name: enable codeready for RedHat
        command:
           cmd: subscription-manager repos --enable "codeready-builder-for-rhel-8-x86_64-rpms"
        when: ansible_facts['distribution'] == "RedHat"

      - name: enable codeready for Oracle
        command:
           cmd: dnf config-manager --set-enabled ol8_codeready_builder
        when: ansible_facts['distribution'] == "OracleLinux"

      - name: install EPEL repo for RedHat
        yum:
           name: https://dl.fedoraproject.org/pub/epel/epel-release-latest-8.noarch.rpm
           state: present
        when: ansible_facts['distribution'] == "RedHat" or ansible_os_family == "Rocky" or ansible_facts['distribution'] == "OracleLinux"

      - name: set powertools / crb
        set_fact:
          powertools: "crb"
        when: ansible_facts['distribution_major_version'] == '9'

      - name: set powertools / crb
        set_fact:
          powertools: "powertools"
        when: ansible_facts['distribution_major_version'] == '8'

      - name: set user_home
        set_fact:
          user_home: "/home"
        when: user_home is undefined

      ## Round 15, us3lims-roles#24 blocking: release-gate's own per-checkout
      ## comparison only ever runs once the first role that includes it does
      ## (config-lims-us3-user, the 5th role below) -- so a mismatched branch
      ## var was only ever caught after config-lims-gui/-admin/-firewall/
      ## -repo had already run. This needs no filesystem access at all (every
      ## *_branch var and site_release are both already known here, in
      ## pre_tasks, before any role runs), and covers all eight branch vars,
      ## not just the six release-gate is actually included in front of --
      ## dbinst_branch and us3_branch included, which nothing checked at all
      ## before this. A real checkout already on disk disagreeing with
      ## site_release is still release-gate's own job, per repo, since that
      ## needs the filesystem; this only catches a misconfigured *_branch
      ## var itself, as early as the play can.
      - name: "release-gate: refuse to continue without site_release_version"
        ansible.builtin.fail:
          msg: >-
            site_release is '{{ site_release }}' but site_release_version is not set. Set it to
            the VERSION that ref carries (e.g. 4.2.0); each checkout's VERSION file is checked
            against it.
        when: site_release is defined and site_release_version | default('') | string | length == 0

      ## Every 4.3.0-specific task, role and template line is skipped for an older release, so a
      ## run on a 4.2.0 host changes nothing and a 4.2.0 install gets 4.2.0's configuration.
      - name: "Note whether this site runs a release before 4.3.0"
        ansible.builtin.set_fact:
          lims_pre_430: "{{ site_release_version is defined and (site_release_version | string) is version('4.3.0', '<') }}"

      - name: "release-gate: refuse to continue if any branch variable disagrees with site_release"
        ansible.builtin.fail:
          msg: >-
            {{ item.key }} is '{{ item.value }}', not this site's declared
            release '{{ site_release }}'. Refusing to continue -- either
            this repo's own branch variable needs to track site_release, or
            site_release needs updating to match what this run actually
            intends to pull.
        loop: "{{ {
            'us3_branch': us3_branch, 'sql_branch': sql_branch, 'dbinst_branch': dbinst_branch,
            'gridctl_branch': gridctl_branch, 'common_branch': common_branch, 'newinst_branch': newinst_branch,
            'webinfo_branch': webinfo_branch, 'utils_branch': utils_branch
          } | dict2items }}"
        when: item.value != site_release

      - name: "Check the upgrade state of the release already on this host"
        ansible.builtin.include_role:
          name: release-gate
          tasks_from: upgrade-state.yml
        when: site_release is defined

  roles:
      # EL8: enable php:7.4 before any role installs php (default stream is the retired 7.2)
      - config-lims-php-stream
      - config-lims-gui
      - config-lims-admin
      - config-lims-firewall
      - config-lims-repo
      - config-lims-us3-user
      - config-lims-database
      - config-lims-apache
      - config-lims-php
      - config-lims-lims
      - config-lims-slurm
      - build-qt
      - build-qwt
      - build-us3
      - build-mpich
      - build-us-mpi
      ## Needs mpirun/us_mpi_analysis, built by the two roles just above
      ## (was included from
      ## inside config-lims-lims, which runs before either is built, so
      ## its own assert always failed on a fresh build).
      - role: config-lims-mpi-runtime
        when: not lims_pre_430 | default(false) | bool
      - install-vncserver
      - install-postfix
      - install-chrony
      - install-google-fonts
      - install-msttcore-fonts
      - install-reverse-tunnel-service
      - renice-mariadb
      - renice-slurmd
      - restart-php-fpm
      - install-demo-dbinst
      ## Starts us3-listen and writes the LIMS cron entries -- moved here,
      ## after every role that calls uslims_upgrade.php (config-lims-lims,
      ## install-demo-dbinst), so the host is still idle when either does
      ## See UPGRADE-AND-INSTALL-MODEL.md.
      - start-lims-services
      - config-lims-backup
      - install-xrdp
      - install-proxychains4
#optional    - install-fail2ban
#scigap-only - config-lims-scigap
      - config-authentication-messages
      
  become: yes
  ## Ansible's vars: on a play takes a mapping, not a sequence -- every
  ## entry here was written as "- key: value", a list of one-key
  ## mappings. A list satisfies no schema vars: actually accepts, so
  ## ansible-playbook --syntax-check refused this whole file outright
  ## ("Vars in a Play must be specified as a dictionary"); nothing in
  ## this list was ever validated as a playbook, pre_tasks included.
  ## Converted here to a plain mapping -- same keys, same values, same
  ## comments, just without the leading "- " on each one.
  vars:
        user_home:           "/home"
        install_workstation: false
        install_commercial:  true
        NO_LIMS:             false

        # set the desired compiler optimization
        # for hardware installs
        comp_opt: "-march=native"
        # perhaps for VM installs if qt core dumps
        # comp_opt: "-m64"

        # innodb_buffer_pool_size
        innodb_buffer_pool_size: "2G"
        # innodb_buffer_pool_size: "8G"

        # uncomment one of the below for default allowed submissions
        submit_localonly: true
        # submit_remoteonly : true
        # submit_localandremote : true

        # Required variables to define:
        # N.B. once you set these, you can't change them simply by rerunning ansible-playbook for the same remote host!
        us3_db_pass:       "foobar-demo"
        root_db_pass:      "foobar-super"
        admins_db_pass:    "foobar-admin"
        gbl_db_pass:       "foobar-global"
        us3php_db_pass:    "foobar-php"
        limsadmin_db_pass: "foobar-iam-admin"

        admin_email:       "example@email.org"
        cron_admin:        "example@email.org" # root@localhost

        ipaddr_ext:        "192.168.5.30"
        ipaddr_int:        "192.168.5.30"

        self_signed: 'yes' # change to 'no' to use certbot

        qt_major_version:  "5.15"
        qt_version:        "5.15.19"
        qwt_version:       "6.3.0"
        cores_for_parallel_compile: "{{ ansible_processor_vcpus }}"
        ## Round 15, us3lims-roles#24 blocking: release-gate (and the
        ## pre_tasks check above) is off unless site_release is set, and
        ## until now nothing here ever set it -- so it never ran on this
        ## playbook's own default pins, only on a site that happened to
        ## define site_release itself in its own inventory/group_vars.
        ## site_release is now the single source of truth these eight pins
        ## derive from by default (still the same literal value as before;
        ## this is a refactor of where it lives, not a change of what it
        ## is), so the gate is active out of the box, and a site that wants
        ## one repo pinned differently from the rest still can by
        ## overriding that one *_branch var directly, same as before.
        site_release:      "release-2026-Q2"
        ## The VERSION file site_release carries; release-gate compares each checkout with it.
        site_release_version: "4.1.0"
        us3_branch:        "{{ site_release }}"
        sql_branch:        "{{ site_release }}"
        dbinst_branch:     "{{ site_release }}"
        gridctl_branch:    "{{ site_release }}"
        common_branch:     "{{ site_release }}"
        newinst_branch:    "{{ site_release }}"
        webinfo_branch:    "{{ site_release }}"
        utils_branch:      "{{ site_release }}"
        ## Pre-4.3.0 only: written into dbutils' db_config.php for the Airavata bridge.
        airavata_branch:   "meta-scheduler-prod"

        postfix_relay_smtp_host: smtp.gmail.com
        postfix_relay_smtp_port: 587
        postfix_relay_smtp_user: us.etc.tests@gmail.com
        postfix_relay_smtp_password: put_app_password_here

        # required for role install-reverse-tunnel-service
        # you will manually need to install usadmin's public key on the rtunnel_user @ rtunnel_ip's authorized keys
        rtunnel_user: "ultrascan"
        rtunnel_ip: "secure.aucsolutions.com"
        # assign unique port (if both rtunnel & rtunnel service installed, use different ports!
        rtunnel_service_port: "220XX"
        # any extra command options required to ssh, e.g. "-J user@jumpserver" etc.
        rtunnel_service_ssh_extras: ""
        ## enabled at boot up - "no" or "yes"
        rtunnel_service_enabled: "yes"
        ## current state -  "started" or "stopped"
        rtunnel_service_state: "started"

        # set this to a specific value (could be numeric ip) instead of {{ ansible_fqdn }} if you with, e.g. if the host is private
        # N.B. you can only configure one host per ansible-playbook run if you do not use {{ ansible_fqdn }}
        hostname: "{{ ansible_fqdn }}"
        postfix_hostname: "{{ hostname }}"
        # N.B. if your host name is pure ip (e.g. 1.2.3.4 etc), you need to configure a text string prefix as commented below
        # postfix_hostname: "us-{{ hostname }}"

        # Doesn't matter if self-signed is enabled but here as an example for some certbot uses
        certbot_create_if_missing: true
        certbot_admin_email: "{{ admin_email }}"
        certbot_create_standalone_stop_services: [httpd] # centos/RHEL
        certbot_certs:
            - domains:
                  - "{{ hostname }}"

        certbot_auto_renew: true
        certbot_auto_renew_hour: "1"
        certbot_auto_renew_minute: "30"
        cerbot_auto_renew_options: "--quiet --no-self-upgrade"

        slurm_ver: 25.11.5 # Change to appropriate version
        slurm_md5: 5bf9efcb4ec746cf31c22e723e42f909

        # N.B. slurm_cores can not exceed available cores, if it does, the node will be stuck "draining" (waiting for available resources)
        #      if you want to develop (not production!) on a smaller system
        #         add "#SBATCH -O" to your sbatch submission scripts to allow overcommitting
        #         set slurm_sbatch_extras : "#SBATCH -O\n" for slurm testing scripts via ansible
        slurm_cores : "{{ ansible_processor_vcpus }}"
        slurm_sbatch_extras : ""
        # slurm_sbatch_extras : "#SBATCH -O\n"

        # Overrride variables that are default
        lims_admin: "John Smith"
        org_name: "Ultrascan Example LIMS"

